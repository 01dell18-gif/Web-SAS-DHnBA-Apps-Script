<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
/**
 * Universal Data Sync & Offline-First Helper
 */
var db = { classes: [], students: [], teachers: [], templates: [], settings: {}, archives: [], users: [] };
window.db = db;

async function loadAdminDatabase() {
    try {
        var res = await callServer('apiGetInitialData');
        if (res && res.success) {
            db.classes = res.classes || [];
            db.templates = res.templates || [];
            db.subjects = res.subjects || [];
            db.academic_years = res.academic_years || [];
            db.teachers = res.teachers || [];
            db.settings = res.settings || {};
        }
        var results = await Promise.all([
            callServer('apiGetStudents').catch(function() { return []; }),
            callServer('apiGetArchives').catch(function() { return []; }),
            callServer('apiGetUsers').catch(function() { return []; })
        ]);
        db.students = results[0] || [];
        db.archives = results[1] || [];
        db.users = results[2] || [];
        window.db = db;
        return db;
    } catch(err) {
        console.error('Error loadAdminDatabase:', err);
        return db;
    }
}
window.loadAdminDatabase = loadAdminDatabase;
window.loadDatabaseFromAppsScript = loadAdminDatabase;

async function saveAdminDatabase(payload) {
    try {
        var res = await callServer('apiSaveDatabase', payload);
        if (res && res.success) {
            return { success: true, message: res.message || 'Data berhasil disimpan ke Google Spreadsheet.' };
        }
        return { success: false, message: (res && res.message) || 'Gagal menyimpan database' };
    } catch(err) {
        return { success: false, message: err.message || 'Terjadi kesalahan sistem' };
    }
}
window.saveAdminDatabase = saveAdminDatabase;

async function setActiveExamTemplate(templateId) {
    var targetId = Number(templateId);
    try {
        var res = await callServer('apiSetActiveTemplate', targetId);
        if (res && res.success) {
            if (window.db && Array.isArray(window.db.templates)) {
                window.db.templates.forEach(function(t) {
                    t.aktif = (Number(t.id) === targetId) ? 1 : 0;
                });
            }
            return { success: true, message: res.message || 'Template aktif berhasil diperbarui.' };
        }
        return { success: false, message: (res && res.message) || 'Gagal mengaktifkan template' };
    } catch(err) {
        return { success: false, message: err.message };
    }
}
window.setActiveExamTemplate = setActiveExamTemplate;

</script>

<!-- SimpleSignaturePad Implementation -->
<script>
class SimpleSignaturePad {
    constructor(canvas, options = {}) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.options = Object.assign({
            penColor: '#000000',
            penWidth: 2,
            onChange: null
        }, options);

        this.isDrawing = false;
        this.lastX = 0;
        this.lastY = 0;
        this.points = [];

        this.initCanvas();
        this.attachEvents();
    }

    initCanvas() {
        const rect = this.canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = (rect.width || 280) * dpr;
        this.canvas.height = (rect.height || 120) * dpr;
        this.ctx.scale(dpr, dpr);
        this.ctx.lineCap = 'round';
        this.ctx.lineJoin = 'round';
        this.ctx.strokeStyle = this.options.penColor;
        this.ctx.lineWidth = this.options.penWidth;
        this.clear();
    }

    getPos(e) {
        const rect = this.canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    attachEvents() {
        const start = (e) => {
            e.preventDefault();
            this.isDrawing = true;
            const pos = this.getPos(e);
            this.lastX = pos.x;
            this.lastY = pos.y;
            this.points = [pos];
        };

        const move = (e) => {
            if (!this.isDrawing) return;
            e.preventDefault();
            const pos = this.getPos(e);
            this.ctx.beginPath();
            this.ctx.moveTo(this.lastX, this.lastY);
            this.ctx.lineTo(pos.x, pos.y);
            this.ctx.stroke();
            this.lastX = pos.x;
            this.lastY = pos.y;
            this.points.push(pos);
        };

        const end = (e) => {
            if (!this.isDrawing) return;
            this.isDrawing = false;
            if (typeof this.options.onChange === 'function') {
                this.options.onChange(this.isEmpty() ? '' : this.toDataURL());
            }
        };

        this.canvas.addEventListener('mousedown', start);
        this.canvas.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);

        this.canvas.addEventListener('touchstart', start, { passive: false });
        this.canvas.addEventListener('touchmove', move, { passive: false });
        window.addEventListener('touchend', end);
    }

    clear() {
        const rect = this.canvas.getBoundingClientRect();
        this.ctx.clearRect(0, 0, rect.width || this.canvas.width, rect.height || this.canvas.height);
        this.points = [];
        if (typeof this.options.onChange === 'function') {
            this.options.onChange('');
        }
    }

    isEmpty() {
        return this.points.length === 0;
    }

    toDataURL() {
        return this.canvas.toDataURL('image/png');
    }
}
</script>

<!-- Popup and Toast Library -->
<script>
/**
 * SISTEM POPUP MODAL & NOTIFIKASI UNIVERSAL (SAS v2.9)
 * SMK NEGERI FYJ CHANNEL
 * Mendukung Dialog Konfirmasi Interaktif, Alert Kustom & Notifikasi Toast
 */

(function(window) {
    function getOverlay() {
        let overlay = document.getElementById('sasGlobalPopupOverlay');
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'sasGlobalPopupOverlay';
            overlay.className = 'sas-popup-overlay';
            overlay.innerHTML = `
                <div class="sas-popup-card" id="sasPopupCard" role="dialog" aria-modal="true">
                    <div class="sas-popup-icon-wrapper" id="sasPopupIconWrap">
                        <i id="sasPopupIcon" class="bi bi-info-circle-fill"></i>
                    </div>
                    <h3 class="sas-popup-title" id="sasPopupTitle">Konfirmasi</h3>
                    <div class="sas-popup-message" id="sasPopupMessage">Pesan konfirmasi</div>
                    <div class="sas-popup-actions" id="sasPopupActions">
                        <button type="button" class="sas-popup-btn sas-popup-btn-cancel" id="sasPopupBtnCancel">
                            <i class="bi bi-x-lg"></i> Batal
                        </button>
                        <button type="button" class="sas-popup-btn sas-popup-btn-confirm-primary" id="sasPopupBtnConfirm">
                            <i class="bi bi-check-lg"></i> Lanjutkan
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }
        return overlay;
    }

    function getToastContainer() {
        let container = document.getElementById('sasToastContainer');
        if (!container) {
            container = document.createElement('div');
            container.id = 'sasToastContainer';
            container.className = 'sas-toast-container';
            document.body.appendChild(container);
        }
        return container;
    }

    /**
     * Tampilkan Modal Konfirmasi Modern (Promise-based & Callback-based)
     * @param {Object|string} opts
     * @returns {Promise<boolean>}
     */
    function showConfirmModal(opts) {
        return new Promise((resolve) => {
            const options = typeof opts === 'string' ? { message: opts } : (opts || {});
            const title = options.title || 'Konfirmasi Tindakan';
            const message = options.message || 'Apakah Anda yakin ingin melanjutkan tindakan ini?';
            const type = options.type || (message.toLowerCase().includes('hapus') || message.toLowerCase().includes('delete') || message.toLowerCase().includes('reset') ? 'danger' : 'warning');
            const confirmText = options.confirmText || (type === 'danger' ? 'Ya, Lanjutkan' : 'Ya, Setuju');
            const cancelText = options.cancelText || 'Batal';
            const confirmIcon = options.confirmIcon || (type === 'danger' ? 'bi-exclamation-octagon-fill' : 'bi-check-lg');

            const overlay = getOverlay();
            const iconWrap = document.getElementById('sasPopupIconWrap');
            const icon = document.getElementById('sasPopupIcon');
            const titleEl = document.getElementById('sasPopupTitle');
            const messageEl = document.getElementById('sasPopupMessage');
            const btnCancel = document.getElementById('sasPopupBtnCancel');
            const btnConfirm = document.getElementById('sasPopupBtnConfirm');

            iconWrap.className = 'sas-popup-icon-wrapper';
            if (type === 'danger') {
                iconWrap.classList.add('sas-popup-icon-danger');
                icon.className = 'bi bi-exclamation-triangle-fill';
                btnConfirm.className = 'sas-popup-btn sas-popup-btn-confirm-danger';
            } else if (type === 'success') {
                iconWrap.classList.add('sas-popup-icon-success');
                icon.className = 'bi bi-check-circle-fill';
                btnConfirm.className = 'sas-popup-btn sas-popup-btn-confirm-success';
            } else if (type === 'info') {
                iconWrap.classList.add('sas-popup-icon-info');
                icon.className = 'bi bi-info-circle-fill';
                btnConfirm.className = 'sas-popup-btn sas-popup-btn-confirm-primary';
            } else {
                iconWrap.classList.add('sas-popup-icon-warning');
                icon.className = 'bi bi-question-circle-fill';
                btnConfirm.className = 'sas-popup-btn sas-popup-btn-confirm-warning';
            }

            titleEl.textContent = title;
            messageEl.textContent = message;

            btnCancel.style.display = 'inline-flex';
            btnCancel.innerHTML = `<i class="bi bi-x-lg"></i> ${cancelText}`;
            btnConfirm.innerHTML = `<i class="bi ${confirmIcon}"></i> ${confirmText}`;

            function close(result) {
                overlay.classList.remove('active');
                cleanup();
                if (result && typeof options.onConfirm === 'function') options.onConfirm();
                if (!result && typeof options.onCancel === 'function') options.onCancel();
                resolve(result);
            }

            function onKeydown(e) {
                if (e.key === 'Escape') close(false);
                if (e.key === 'Enter') {
                    e.preventDefault();
                    close(true);
                }
            }

            function onOverlayClick(e) {
                if (e.target === overlay) close(false);
            }

            function cleanup() {
                btnCancel.removeEventListener('click', handleCancel);
                btnConfirm.removeEventListener('click', handleConfirm);
                document.removeEventListener('keydown', onKeydown);
                overlay.removeEventListener('click', onOverlayClick);
            }

            function handleCancel() { close(false); }
            function handleConfirm() { close(true); }

            btnCancel.addEventListener('click', handleCancel);
            btnConfirm.addEventListener('click', handleConfirm);
            document.addEventListener('keydown', onKeydown);
            overlay.addEventListener('click', onOverlayClick);

            overlay.classList.add('active');
            btnConfirm.focus();
        });
    }

    /**
     * Tampilkan Modal Alert / Peringatan Modern
     * @param {Object|string} opts
     * @returns {Promise<void>}
     */
    function showAlertModal(opts) {
        return new Promise((resolve) => {
            const options = typeof opts === 'string' ? { message: opts } : (opts || {});
            const title = options.title || 'Informasi';
            const message = options.message || '';
            const type = options.type || 'info';
            const confirmText = options.confirmText || 'Mengerti';

            const overlay = getOverlay();
            const iconWrap = document.getElementById('sasPopupIconWrap');
            const icon = document.getElementById('sasPopupIcon');
            const titleEl = document.getElementById('sasPopupTitle');
            const messageEl = document.getElementById('sasPopupMessage');
            const btnCancel = document.getElementById('sasPopupBtnCancel');
            const btnConfirm = document.getElementById('sasPopupBtnConfirm');

            iconWrap.className = 'sas-popup-icon-wrapper';
            if (type === 'danger') {
                iconWrap.classList.add('sas-popup-icon-danger');
                icon.className = 'bi bi-x-circle-fill';
                btnConfirm.className = 'sas-popup-btn sas-popup-btn-confirm-danger';
            } else if (type === 'success') {
                iconWrap.classList.add('sas-popup-icon-success');
                icon.className = 'bi bi-check-circle-fill';
                btnConfirm.className = 'sas-popup-btn sas-popup-btn-confirm-success';
            } else if (type === 'warning') {
                iconWrap.classList.add('sas-popup-icon-warning');
                icon.className = 'bi bi-exclamation-triangle-fill';
                btnConfirm.className = 'sas-popup-btn sas-popup-btn-confirm-warning';
            } else {
                iconWrap.classList.add('sas-popup-icon-info');
                icon.className = 'bi bi-info-circle-fill';
                btnConfirm.className = 'sas-popup-btn sas-popup-btn-confirm-primary';
            }

            titleEl.textContent = title;
            messageEl.textContent = message;

            btnCancel.style.display = 'none';
            btnConfirm.innerHTML = `<i class="bi bi-check-lg"></i> ${confirmText}`;

            function close() {
                overlay.classList.remove('active');
                cleanup();
                if (typeof options.onConfirm === 'function') options.onConfirm();
                resolve();
            }

            function onKeydown(e) {
                if (e.key === 'Escape' || e.key === 'Enter') {
                    e.preventDefault();
                    close();
                }
            }

            function onOverlayClick(e) {
                if (e.target === overlay) close();
            }

            function cleanup() {
                btnConfirm.removeEventListener('click', close);
                document.removeEventListener('keydown', onKeydown);
                overlay.removeEventListener('click', onOverlayClick);
            }

            btnConfirm.addEventListener('click', close);
            document.addEventListener('keydown', onKeydown);
            overlay.addEventListener('click', onOverlayClick);

            overlay.classList.add('active');
            btnConfirm.focus();
        });
    }

    /**
     * Tampilkan Notifikasi Toast Mengambang
     * @param {string} message
     * @param {'info'|'success'|'warning'|'danger'} type
     */
    function showToast(message, type = 'info') {
        const container = getToastContainer();
        const toast = document.createElement('div');
        toast.className = `sas-toast-item toast-${type}`;

        let iconClass = 'bi-info-circle-fill';
        if (type === 'success') iconClass = 'bi-check-circle-fill';
        else if (type === 'danger') iconClass = 'bi-x-circle-fill';
        else if (type === 'warning') iconClass = 'bi-exclamation-triangle-fill';

        toast.innerHTML = `
            <i class="bi ${iconClass} sas-toast-icon"></i>
            <div style="flex: 1; line-height: 1.4;">${message}</div>
            <button type="button" style="background:none; border:none; color:inherit; opacity:0.6; cursor:pointer; font-size:1.1rem; padding:0 0 0 6px;" aria-label="Tutup">&times;</button>
            <div class="sas-toast-progress"></div>
        `;

        const btnClose = toast.querySelector('button');
        if (btnClose) {
            btnClose.onclick = () => dismiss();
        }

        container.appendChild(toast);

        requestAnimationFrame(() => {
            toast.classList.add('show');
        });

        let timer = setTimeout(dismiss, 3500);

        function dismiss() {
            clearTimeout(timer);
            toast.classList.remove('show');
            setTimeout(() => {
                if (toast.parentElement) toast.parentElement.removeChild(toast);
            }, 300);
        }
    }

    // Expose ke global window
    window.showConfirmModal = showConfirmModal;
    window.showAlertModal = showAlertModal;
    window.showPopupConfirm = showConfirmModal;
    window.showPopupAlert = showAlertModal;
    window.showToast = showToast;
    window.showNotification = showToast;

})(window);

</script>

<!-- Global App Controller Scripts -->
<script>
var _APP_URL = '<?= appUrl ?>';

function getAppUrl() {
    if (_APP_URL && _APP_URL.length > 5) return _APP_URL;
    return window.location.href.split('?')[0];
}

function navigateTo(page, params) {
    var url = getAppUrl() + '?page=' + encodeURIComponent(page);
    if (params && typeof params === 'object') {
        for (var k in params) {
            if (params.hasOwnProperty(k)) {
                url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
            }
        }
    }
    window.location.href = url;
}

function openAdminPortal() {
    var isAuth = localStorage.getItem('sas_admin_auth') === '1';
    if (isAuth) {
        navigateTo('dashboard');
    } else {
        navigateTo('login');
    }
}

function toggleMobileNav(e) {
    if (e) e.stopPropagation();
    var nav = document.getElementById('navLinks');
    if (nav) nav.classList.toggle('active');
}

function toggleAdminSidebar() {
    var sidebar = document.getElementById('adminSidebar');
    if (sidebar) sidebar.classList.toggle('collapsed');
}

function togglePasswordVisibility(inputId, iconId) {
    var inp = document.getElementById(inputId || 'password');
    var icn = document.getElementById(iconId || 'iconEye');
    if (!inp) return;
    if (inp.type === 'password') {
        inp.type = 'text';
        if (icn) icn.className = 'bi bi-eye-slash';
    } else {
        inp.type = 'password';
        if (icn) icn.className = 'bi bi-eye';
    }
}

function confirmLogout() {
    showConfirmModal({
        title: 'Konfirmasi Keluar',
        message: 'Apakah Anda yakin ingin keluar dari Panel Administrator?',
        type: 'warning',
        confirmText: 'Ya, Keluar',
        cancelText: 'Tetap di Sini'
    }).then(function(confirmed) {
        if (confirmed) {
            localStorage.removeItem('sas_admin_auth');
            localStorage.removeItem('sas_admin_user');
            localStorage.removeItem('sas_admin_role');
            showToast('info', 'Anda telah berhasil keluar.');
            setTimeout(function() {
                navigateTo('landing');
            }, 500);
        }
    });
}

// Inisialisasi Role Operator Guard pada Sidebar & User Badge
document.addEventListener('DOMContentLoaded', function() {
    var userJson = localStorage.getItem('sas_admin_user');
    var userRole = (localStorage.getItem('sas_admin_role') || '').toLowerCase();
    
    var elUser = document.getElementById('adminUsername');
    if (elUser && userJson) {
        try {
            var uObj = JSON.parse(userJson);
            elUser.textContent = uObj.nama || uObj.username;
        } catch(e) {}
    }

    if (userRole === 'operator') {
        var adminOnlyMenus = document.querySelectorAll('.admin-only-menu');
        adminOnlyMenus.forEach(function(el) {
            el.style.display = 'none';
        });
    }
});

/**
 * Universal RPC Caller untuk memanggil backend Google Apps Script secara rapi berbasis Promise
 */
function callServer(functionName, ...args) {
    return new Promise(function(resolve, reject) {
        if (!google || !google.script || !google.script.run) {
            reject(new Error('google.script.run tidak tersedia di lingkungan ini.'));
            return;
        }
        var runner = google.script.run
            .withSuccessHandler(function(response) {
                resolve(response);
            })
            .withFailureHandler(function(err) {
                reject(err);
            });
        
        if (typeof runner[functionName] === 'function') {
            runner[functionName].apply(runner, args);
        } else {
            reject(new Error('Fungsi ' + functionName + ' tidak ditemukan di Code.gs.'));
        }
    });
}
</script>
