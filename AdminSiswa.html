<div class="admin-sidebar-layout">

    <main class="admin-main">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-heading); margin: 0;">Kelola Data Siswa</h1>

                <a href="<?= appUrl ?>?page=import" target="_top" onclick="navigateTo('import'); return false;" class="btn btn-secondary btn-sm">
                    <i class="bi bi-file-earmark-arrow-up"></i> Impor Excel
                </a>
                <button type="button" class="btn btn-secondary btn-sm" onclick="exportSiswaExcel()">
                    <i class="bi bi-file-earmark-excel"></i> Ekspor Excel
                </button>
                <button type="button" class="btn btn-danger-soft btn-sm" onclick="confirmResetAllSiswa()">
                    <i class="bi bi-trash3"></i> Hapus Semua
                </button>

        <!-- Filter Card -->
        <div class="horizontal-filter-card">

            </div>
            <div class="horizontal-filter-item" style="max-width: 220px;">

                    <option value="">Semua Kelas</option>

            </div>
        </div>

        <div class="card">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
                <span class="card-title"><i class="bi bi-people"></i> Daftar Peserta Didik</span>
                <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
                    <div class="btn-group" role="group" aria-label="Status Bulk Toggle" style="display: inline-flex;">
                        <button type="button" class="btn btn-outline-success btn-sm" onclick="toggleAllMasterStatus('siswa', 1, loadSiswaData)" title="Aktifkan seluruh data siswa">
                            <i class="bi bi-check-all"></i> Aktifkan Semua
                        </button>
                        <button type="button" class="btn btn-outline-danger btn-sm" onclick="toggleAllMasterStatus('siswa', 0, loadSiswaData)" title="Nonaktifkan seluruh data siswa">

                    <span id="badgeTotalSiswa" class="badge" style="background: #e0e7ff; color: #4338ca; font-weight: 700;">0 Siswa</span>

            <div class="table-responsive">
                <table class="table" style="font-size: 0.875rem;">
                    <thead>
                        <tr>
                            <th style="width: 35px;">No</th>

                            <th>Program Keahlian</th>
                            <th style="text-align: center; white-space: nowrap;">Status</th>
                            <th style="text-align: center; width: 120px;">Aksi</th>

                    <tbody id="tableSiswaBody">
                        <tr><td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-muted);"><i class="bi bi-arrow-repeat spin"></i> Memuat data siswa...</td></tr>

</div>

<!-- Modal Form Siswa -->
<div id="modalFormSiswa" class="custom-modal" style="display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.6); z-index: 999999; align-items: center; justify-content: center;">
    <div style="background: #ffffff; width: 90%; max-width: 480px; border-radius: 14px; padding: 1.5rem; box-shadow: 0 20px 45px rgba(0,0,0,0.25);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
            <h3 id="modalSiswaTitle" style="font-size: 1.15rem; font-weight: 700; margin: 0;">Tambah Siswa Baru</h3>
            <button type="button" onclick="closeSiswaModal()" style="background:none; border:none; font-size:1.4rem; cursor:pointer; color:#94a3b8;">&times;</button>
        </div>
        <form id="formSiswaInput" onsubmit="handleSaveSiswa(event)">
            <input type="hidden" id="siswa_id" value="">
            <div class="form-group">
                <label class="form-label" for="siswa_class_id">Kelas <span class="required">*</span></label>
                <select id="siswa_class_id" class="form-select" required></select>
            </div>
            <div class="form-group">
                <label class="form-label" for="siswa_nama">Nama Lengkap Siswa <span class="required">*</span></label>
                <input type="text" id="siswa_nama" class="form-control" placeholder="Nama lengkap siswa" required>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="siswa_nis">NIS</label>
                    <input type="text" id="siswa_nis" class="form-control" placeholder="Nomor Induk Siswa">
                </div>
                <div class="form-group">
                    <label class="form-label" for="siswa_nisn">NISN</label>
                    <input type="text" id="siswa_nisn" class="form-control" placeholder="NISN Nasional">
                </div>
            </div>
            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" id="siswa_aktif" checked>
                    <span>Siswa Aktif</span>
                </label>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
                <button type="button" class="btn btn-secondary" onclick="closeSiswaModal()">Batal</button>
                <button type="submit" id="btnSaveSiswa" class="btn btn-primary">Simpan Siswa</button>
            </div>
        </form>

<script>
var siswaList = [];

document.addEventListener('DOMContentLoaded', function() {
    loadSiswaData();
});

function loadSiswaData(isRetry) {
    var tbody = document.getElementById('tableSiswaBody');
    if (tbody) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-muted);"><div class="spinner-border spinner-border-sm" role="status"></div> Memuat data siswa...</td></tr>';
    }
    google.script.run
        .withSuccessHandler(function(data) {
            window.AppStore.data = data;
            siswaList = (data && data.students) || [];

            // Auto-heal: jika masih 0 dan belum pernah coba reseed otomatis
            if ((!siswaList || siswaList.length === 0) && !isRetry) {
                if (tbody) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-muted);"><div class="spinner-border spinner-border-sm" role="status"></div> Menginisialisasi 258 data siswa resmi...</td></tr>';
                }
                google.script.run
                    .withSuccessHandler(function() {
                        loadSiswaData(true);
                    })
                    .withFailureHandler(function() {
                        filterSiswaTable();
                    })
                    .apiForceReseedAllMasterData();
                return;
            }

            // Populate Class Selects
            var fSelect = document.getElementById('filterSiswaKelas');
            var mSelect = document.getElementById('siswa_class_id');
            fSelect.innerHTML = '<option value="">Semua Kelas</option>';
            mSelect.innerHTML = '<option value="">-- Pilih Kelas --</option>';

            var classes = (data && data.classes) || [];
            classes.forEach(function(c) {
                var opt1 = document.createElement('option');
                opt1.value = c.id;
                opt1.textContent = c.nama_kelas;
                fSelect.appendChild(opt1);

                var opt2 = document.createElement('option');
                opt2.value = c.id;
                opt2.textContent = c.nama_kelas;
                mSelect.appendChild(opt2);
            });

            // Check URL param class_id
            var serverCid = '<?= (params && params.class_id) ? params.class_id : "" ?>';
            var urlParams = new URLSearchParams(window.location.search);
            var targetCid = serverCid || urlParams.get('class_id');
            if (targetCid) fSelect.value = targetCid;

            filterSiswaTable();
        })
        .withFailureHandler(function(err) {
            if (tbody) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 2rem;">' +
                    '<div style="color: #e11d48; font-weight: 700; margin-bottom: 0.5rem;"><i class="bi bi-exclamation-triangle-fill"></i> Gagal memuat data siswa</div>' +
                    '<div style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">' + (err && err.message ? err.message : err) + '</div>' +
                    '<button type="button" class="btn btn-primary btn-sm" onclick="loadSiswaData()"><i class="bi bi-arrow-clockwise"></i> Coba Muat Ulang</button>' +
                    '</td></tr>';
            }
            showGlobalToast('Gagal memuat data siswa: ' + (err && err.message ? err.message : err), 'danger');
        })
        .apiGetInitialData();
}

function filterSiswaTable() {
    var q = document.getElementById('searchSiswa').value.trim().toLowerCase();
    var cid = document.getElementById('filterSiswaKelas').value;

    var filtered = siswaList.filter(function(s) {
        if (cid && String(s.class_id) !== String(cid)) return false;
        if (q) {
            var matchQ = (s.nama && s.nama.toLowerCase().indexOf(q) !== -1) ||
                         (s.nis && String(s.nis).indexOf(q) !== -1) ||
                         (s.nisn && String(s.nisn).indexOf(q) !== -1);
            if (!matchQ) return false;
        }
        return true;
    });

    renderSiswaTable(filtered);
}

function renderSiswaTable(students) {
    var tbody = document.getElementById('tableSiswaBody');
    document.getElementById('badgeTotalSiswa').textContent = students.length + ' Siswa';

    if (!students || students.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 2.5rem 1rem; color: var(--text-muted);">' +
            '<div style="font-size: 1.05rem; font-weight: 700; color: #334155; margin-bottom: 0.5rem;"><i class="bi bi-people" style="font-size: 2rem; display: block; margin-bottom: 0.5rem; color: #94a3b8;"></i>Belum ada data siswa di database</div>' +
            '<p style="font-size: 0.85rem; margin-bottom: 1rem;">Data siswa di spreadsheet masih kosong. Anda dapat menginisialisasi 258 siswa peserta ujian resmi secara otomatis.</p>' +
            '<button type="button" class="btn btn-primary btn-sm" onclick="reseedAllMasterTables(loadSiswaData)"><i class="bi bi-magic"></i> Inisialisasi Data Master Default (11 Kelas, 258 Siswa)</button>' +
            '</td></tr>';
        return;
    }

    var html = '';
    var classes = (window.AppStore.data && window.AppStore.data.classes) || [];
    students.forEach(function(s, idx) {
        var cls = classes.find(function(c) { return String(c.id) === String(s.class_id); });
        var namaKelas = cls ? cls.nama_kelas : (s.nama_kelas || '-');
        var jurusan = cls ? cls.program_keahlian : '-';
        var isActive = (String(s.aktif) === '1' || s.aktif === true || s.aktif == 1);
        var stBadge = '<button type="button" class="status-toggle-btn" onclick="toggleUniversalMasterStatus(\'siswa\', ' + s.id + ', ' + (isActive ? 1 : 0) + ', this)" title="Klik untuk mengubah status Siswa Aktif / Nonaktif">' +
            '<span class="status-pill-badge ' + (isActive ? 'is-active' : 'is-inactive') + '">' +
            '<i class="bi ' + (isActive ? 'bi-check-circle-fill' : 'bi-x-circle-fill') + '"></i> ' +
            '<span>' + (isActive ? 'Aktif' : 'Nonaktif') + '</span>' +
            '</span></button>';

        html += '<tr>' +
            '<td>' + (idx + 1) + '</td>' +
            '<td>' + (s.nis || '-') + '</td>' +
            '<td>' + (s.nisn || '-') + '</td>' +
            '<td><strong>' + s.nama + '</strong></td>' +
            '<td><span class="badge" style="background:#f1f5f9; color:#1e293b; font-weight:600;">' + namaKelas + '</span></td>' +
            '<td>' + jurusan + '</td>' +
            '<td style="text-align: center;">' + stBadge + '</td>' +
            '<td style="text-align: center; white-space: nowrap;">' +
            '<button type="button" class="btn btn-secondary btn-sm" onclick="editSiswa(' + s.id + ')" title="Edit Siswa" style="padding: 2px 7px;"><i class="bi bi-pencil-square"></i></button> ' +
            '<button type="button" class="btn btn-danger-soft btn-sm" onclick="deleteSiswa(' + s.id + ', \'' + s.nama + '\')" title="Hapus Siswa" style="padding: 2px 7px;"><i class="bi bi-trash"></i></button>' +
            '</td>' +
            '</tr>';
    });
    tbody.innerHTML = html;
}

function openSiswaModal() {
    document.getElementById('modalSiswaTitle').textContent = 'Tambah Siswa Baru';
    document.getElementById('siswa_id').value = '';
    document.getElementById('siswa_nama').value = '';
    document.getElementById('siswa_nis').value = '';
    document.getElementById('siswa_nisn').value = '';
    document.getElementById('siswa_aktif').checked = true;
    document.getElementById('modalFormSiswa').style.display = 'flex';
}

function editSiswa(id) {
    var s = siswaList.find(function(item) { return String(item.id) === String(id); });
    if (!s) return;
    document.getElementById('modalSiswaTitle').textContent = 'Edit Data Siswa';
    document.getElementById('siswa_id').value = s.id;
    document.getElementById('siswa_class_id').value = s.class_id;
    document.getElementById('siswa_nama').value = s.nama;
    document.getElementById('siswa_nis').value = s.nis || '';
    document.getElementById('siswa_nisn').value = s.nisn || '';
    document.getElementById('siswa_aktif').checked = (String(s.aktif) === '1' || s.aktif === true);
    document.getElementById('modalFormSiswa').style.display = 'flex';
}

function closeSiswaModal() {
    document.getElementById('modalFormSiswa').style.display = 'none';
}

function handleSaveSiswa(e) {
    e.preventDefault();
    var cid = document.getElementById('siswa_class_id').value;
    var nama = document.getElementById('siswa_nama').value.trim();
    var btn = document.getElementById('btnSaveSiswa');
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Menyimpan...';

    var cSelect = document.getElementById('siswa_class_id');
    var namaKelas = cSelect.options[cSelect.selectedIndex].text;

    var payload = {
        id: document.getElementById('siswa_id').value || null,
        class_id: cid,
        nama_kelas: namaKelas,
        nama: nama,
        nis: document.getElementById('siswa_nis').value.trim(),
        nisn: document.getElementById('siswa_nisn').value.trim(),
        aktif: document.getElementById('siswa_aktif').checked ? 1 : 0
    };

    google.script.run
        .withSuccessHandler(function() {
            btn.disabled = false;
            btn.innerHTML = 'Simpan Siswa';
            closeSiswaModal();
            showGlobalNotificationDialog('Berhasil', 'Data siswa ' + nama + ' berhasil disimpan.', 'success');
            loadSiswaData();
        })
        .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerHTML = 'Simpan Siswa';
            showGlobalNotificationDialog('Gagal', err.message, 'danger');
        })
        .apiSaveSiswa(payload);
}

function deleteSiswa(id, nama) {
    showGlobalConfirmDialog(
        'Konfirmasi Hapus Siswa',
        'Apakah Anda yakin ingin menghapus peserta didik ' + nama + '?',
        function() {
            google.script.run
                .withSuccessHandler(function() {
                    showGlobalNotificationDialog('Berhasil', 'Siswa ' + nama + ' berhasil dihapus.', 'success');
                    loadSiswaData();
                })
                .apiDeleteSiswa(id);
        },
        'Hapus',
        true
    );
}

function confirmResetAllSiswa() {
    showConfirmResetModal(
        function() {
            google.script.run
                .withSuccessHandler(function() {
                    showGlobalNotificationDialog('Berhasil', 'Seluruh data siswa telah dikosongkan.', 'success');
                    loadSiswaData();
                })
                .apiDeleteAllSiswa();
        },
        'Reset Hapus Semua Siswa',
        'Tindakan ini akan mengosongkan seluruh master siswa dari database. Apakah Anda yakin ingin melanjutkan?'
    );
}

function exportSiswaExcel() {
    var cid = document.getElementById('filterSiswaKelas').value;
    var filtered = siswaList;
    var classLabel = 'Semua_Kelas';
    if (cid) {
        filtered = siswaList.filter(function(s) { return String(s.class_id) === String(cid); });
        var cls = window.AppStore.data.classes.find(function(c) { return String(c.id) === String(cid); });
        if (cls) classLabel = cls.nama_kelas.replace(/\s+/g, '_');
    }

    var filename = 'Data_Siswa_' + classLabel + '_' + new Date().toISOString().split('T')[0] + '.xlsx';
    var headers = ['No', 'NIS', 'NISN', 'Nama Siswa', 'Kelas', 'Program Keahlian', 'Status'];
    var rows = [];
    var classes = (window.AppStore.data && window.AppStore.data.classes) || [];

    filtered.forEach(function(s, idx) {
        var cls = classes.find(function(c) { return String(c.id) === String(s.class_id); });
        var nk = cls ? cls.nama_kelas : s.nama_kelas;
        var jur = cls ? cls.program_keahlian : '-';
        var st = (String(s.aktif) === '1' || s.aktif === true) ? 'Aktif' : 'Nonaktif';
        rows.push([idx + 1, s.nis || '-', s.nisn || '-', s.nama, nk, jur, st]);
    });

    downloadExcelXLS(filename, headers, rows);
}
</script>
</body>
</html>
