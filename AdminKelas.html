<script type="application/json" id="serverDataKelas">
<?!= (typeof serverData !== 'undefined' && serverData) ? JSON.stringify(serverData) : 'null' ?>
</script>

<script>
var kelasList = [];
var initialServerData = null;
try {
    var rawServerData = document.getElementById('serverDataKelas');
    if (rawServerData && rawServerData.textContent.trim()) {
        initialServerData = JSON.parse(rawServerData.textContent.trim());
    }
} catch (e) {}

function initKelasPage() {
    if (initialServerData && initialServerData.classes && initialServerData.classes.length > 0) {
        window.AppStore.data = initialServerData;
        kelasList = initialServerData.classes;
        renderKelasTable(kelasList);
    } else {
        loadKelasData();
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initKelasPage);
} else {
    initKelasPage();
}

function loadKelasData(isRetry) {
    var tbody = document.getElementById('tableKelasBody');
    if (tbody && (!kelasList || kelasList.length === 0)) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-muted);"><div class="spinner-border spinner-border-sm" role="status"></div> Memuat data kelas...</td></tr>';
    }
    google.script.run
        .withSuccessHandler(function(data) {
            if (!data || data.success === false) {
                var errMsg = (data && data.error) ? data.error : 'Terjadi kegagalan mengambil data dari spreadsheet.';
                if (tbody && (!kelasList || kelasList.length === 0)) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem;">' +
                        '<div style="color: #e11d48; font-weight: 700; margin-bottom: 0.5rem;"><i class="bi bi-exclamation-triangle-fill"></i> Gagal Memuat Data Kelas</div>' +
                        '<div style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">' + errMsg + '</div>' +
                        '<button type="button" class="btn btn-primary btn-sm" onclick="loadKelasData()"><i class="bi bi-arrow-clockwise"></i> Coba Muat Ulang</button>' +
                        '</td></tr>';
                }
                showGlobalToast(errMsg, 'danger');
                return;
            }
            window.AppStore.data = data;
            kelasList = (data && data.classes) || [];
            renderKelasTable(kelasList);
        })
        .withFailureHandler(function(err) {
            if (tbody && (!kelasList || kelasList.length === 0)) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem;">' +
                    '<div style="color: #e11d48; font-weight: 700; margin-bottom: 0.5rem;"><i class="bi bi-exclamation-triangle-fill"></i> Gagal memuat data kelas</div>' +
                    '<div style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">' + (err && err.message ? err.message : err) + '</div>' +
                    '<button type="button" class="btn btn-primary btn-sm" onclick="loadKelasData()"><i class="bi bi-arrow-clockwise"></i> Coba Muat Ulang</button>' +
                    '</td></tr>';
            }
            showGlobalToast('Gagal memuat data kelas: ' + (err && err.message ? err.message : err), 'danger');
        })
        .apiGetInitialData();
}

function renderKelasTable(classes) {
    var tbody = document.getElementById('tableKelasBody');
    if (!classes || classes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2.5rem 1rem; color: var(--text-muted);">' +
            '<div style="font-size: 1.05rem; font-weight: 700; color: #334155; margin-bottom: 0.5rem;"><i class="bi bi-inbox" style="font-size: 2rem; display: block; margin-bottom: 0.5rem; color: #94a3b8;"></i>Belum ada data rombel kelas di database</div>' +
            '<p style="font-size: 0.85rem; margin-bottom: 1rem;">Data kelas di spreadsheet masih kosong. Anda dapat menginisialisasi 11 rombel kelas resmi secara otomatis.</p>' +
            '<button type="button" class="btn btn-primary btn-sm" onclick="reseedAllMasterTables(loadKelasData)"><i class="bi bi-magic"></i> Inisialisasi Data Master Default (11 Kelas, 258 Siswa)</button>' +
            '</td></tr>';
        return;
    }

    var html = '';
    var students = (window.AppStore.data && window.AppStore.data.students) || [];
    classes.forEach(function(c, idx) {
        var sCount = students.filter(function(s) { return String(s.class_id) === String(c.id); }).length;
        var isActive = (String(c.aktif) === '1' || c.aktif === true || c.aktif == 1);
        var stBadge = '<button type="button" class="status-toggle-btn" onclick="toggleUniversalMasterStatus(\'kelas\', ' + c.id + ', ' + (isActive ? 1 : 0) + ', this)" title="Klik untuk mengubah status Kelas Aktif / Nonaktif">' +
            '<span class="status-pill-badge ' + (isActive ? 'is-active' : 'is-inactive') + '">' +
            '<i class="bi ' + (isActive ? 'bi-check-circle-fill' : 'bi-x-circle-fill') + '"></i> ' +
            '<span>' + (isActive ? 'Aktif' : 'Nonaktif') + '</span>' +
            '</span></button>';

        html += '<tr>' +
            '<td>' + (idx + 1) + '</td>' +
            '<td><strong>' + c.nama_kelas + '</strong></td>' +
            '<td>' + (c.tingkat || 'XII') + '</td>' +
            '<td>' + (c.program_keahlian || '-') + '</td>' +
            '<td style="text-align: center;"><span class="badge" style="background: #e0e7ff; color: #4338ca; font-weight: 700;">' + sCount + ' Siswa</span></td>' +
            '<td style="text-align: center;">' + stBadge + '</td>' +
            '<td style="text-align: center; white-space: nowrap;">' +
            '<button type="button" class="btn btn-secondary btn-sm" onclick="editKelas(' + c.id + ')" title="Edit Kelas" style="padding: 2px 7px;"><i class="bi bi-pencil-square"></i></button> ' +
            '<button type="button" class="btn btn-danger-soft btn-sm" onclick="deleteKelas(' + c.id + ', \'' + c.nama_kelas + '\')" title="Hapus Kelas" style="padding: 2px 7px;"><i class="bi bi-trash"></i></button>' +
            '</td>' +
            '</tr>';
    });
    tbody.innerHTML = html;
}

function exportKelasExcel() {
    var headers = ['No', 'Nama Kelas', 'Tingkat', 'Program Keahlian', 'Jumlah Siswa', 'Status'];
    var students = (window.AppStore.data && window.AppStore.data.students) || [];
    var rows = kelasList.map(function(c, i) {
        var sCount = students.filter(function(s) { return String(s.class_id) === String(c.id); }).length;
        return [i + 1, c.nama_kelas, c.tingkat || 'XII', c.program_keahlian || '-', sCount, (c.aktif == 1 ? 'Aktif' : 'Nonaktif')];
    });
    var filename = 'Data_Kelas_' + new Date().toISOString().split('T')[0] + '.xlsx';
    downloadExcelXLS(filename, headers, rows);
}

function filterKelasTable() {
    var q = document.getElementById('searchKelas').value.trim().toLowerCase();
    var filtered = kelasList.filter(function(c) {
        return (c.nama_kelas && c.nama_kelas.toLowerCase().indexOf(q) !== -1) ||
               (c.program_keahlian && c.program_keahlian.toLowerCase().indexOf(q) !== -1);
    });
    renderKelasTable(filtered);
}

function openKelasModal() {
    document.getElementById('modalKelasTitle').textContent = 'Tambah Kelas Baru';
    document.getElementById('kelas_id').value = '';
    document.getElementById('kelas_nama').value = '';
    document.getElementById('kelas_tingkat').value = 'XII';
    document.getElementById('kelas_jurusan').value = '';
    document.getElementById('kelas_aktif').checked = true;
    document.getElementById('modalFormKelas').style.display = 'flex';
}

function editKelas(id) {
    var c = kelasList.find(function(item) { return String(item.id) === String(id); });
    if (!c) return;
    document.getElementById('modalKelasTitle').textContent = 'Edit Data Kelas';
    document.getElementById('kelas_id').value = c.id;
    document.getElementById('kelas_nama').value = c.nama_kelas;
    document.getElementById('kelas_tingkat').value = c.tingkat || 'XII';
    document.getElementById('kelas_jurusan').value = c.program_keahlian || '';
    document.getElementById('kelas_aktif').checked = (String(c.aktif) === '1' || c.aktif === true);
    document.getElementById('modalFormKelas').style.display = 'flex';
}

function closeKelasModal() {
    document.getElementById('modalFormKelas').style.display = 'none';
}

function handleSaveKelas(e) {
    e.preventDefault();
    var id = document.getElementById('kelas_id').value;
    var nama = document.getElementById('kelas_nama').value.trim();
    var tingkat = document.getElementById('kelas_tingkat').value;
    var jurusan = document.getElementById('kelas_jurusan').value.trim();
    var aktif = document.getElementById('kelas_aktif').checked ? 1 : 0;

    var btn = document.getElementById('btnSaveKelas');
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Menyimpan...';

    var payload = {
        id: id || null,
        nama_kelas: nama,
        tingkat: tingkat,
        program_keahlian: jurusan,
        aktif: aktif
    };

    google.script.run
        .withSuccessHandler(function() {
            btn.disabled = false;
            btn.innerHTML = 'Simpan Kelas';
            closeKelasModal();
            showGlobalNotificationDialog('Berhasil', 'Data kelas ' + nama + ' berhasil disimpan.', 'success', function() {
                loadKelasData();
            });
            loadKelasData();
        })
        .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerHTML = 'Simpan Kelas';
            showGlobalNotificationDialog('Gagal', err.message, 'danger');
        })
        .apiSaveKelas(payload);
}

function deleteKelas(id, nama) {
    showGlobalConfirmDialog(
        'Konfirmasi Hapus Kelas',
        'Apakah Anda yakin ingin menghapus kelas ' + nama + '?',
        function() {
            google.script.run
                .withSuccessHandler(function() {
                    showGlobalNotificationDialog('Berhasil', 'Kelas ' + nama + ' berhasil dihapus.', 'success', function() {
                        loadKelasData();
                    });
                    loadKelasData();
                })
                .apiDeleteKelas(id);
        },
        'Hapus',
        true
    );
}

function confirmResetAllKelas() {
    showConfirmResetModal(
        function() {
            google.script.run
                .withSuccessHandler(function() {
                    showGlobalNotificationDialog('Berhasil', 'Seluruh data kelas telah direset.', 'success', function() {
                        safeReload('kelas');
                    });
                    loadKelasData();
                })
                .apiDeleteAllKelas();
        },
        'Reset Hapus Semua Kelas',
        'Tindakan ini akan mengosongkan seluruh master kelas. Apakah Anda yakin ingin melanjutkan?'
    );
}
</script>
</body>
</html>
