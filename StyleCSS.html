<script>
  (function() {
    var p = '<?= currentPage ?>';
    var authPages = ['dashboard', 'siswa', 'guru', 'template', 'admin-arsip', 'pengaturan', 'users', 'database'];
    if (authPages.indexOf(p) !== -1) {
      var isAuth = localStorage.getItem('sas_admin_auth') === '1';
      var role = (localStorage.getItem('sas_admin_role') || 'admin').toLowerCase();
      if (!isAuth) {
        document.documentElement.style.display = 'none';
        window.location.replace('<?= appUrl ?>?page=login');
        return;
      }
      if (role === 'operator' && (p === 'users' || p === 'database')) {
        document.documentElement.style.display = 'none';
        window.location.replace('<?= appUrl ?>?page=dashboard');
        return;
      }
    }
  })();
</script>

/* ==========================================================================
   MODERN POPUP & MODAL DIALOG SYSTEM (SAS v2.9)
   ========================================================================== */
.sas-popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.sas-popup-overlay.active {
    opacity: 1;
    pointer-events: auto;
}

.sas-popup-card {
    background: #ffffff;
    width: 100%;
    max-width: 460px;
    border-radius: 20px;
    padding: 2.2rem 2rem 1.75rem 2rem;
    box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.35), 0 0 0 1px rgba(226, 232, 240, 0.8);
    transform: scale(0.92) translateY(12px);
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    text-align: center;
    position: relative;
    overflow: hidden;
}

.sas-popup-overlay.active .sas-popup-card {
    transform: scale(1) translateY(0);
}

.sas-popup-icon-wrapper {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    margin: 0 auto 1.25rem auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    position: relative;
    animation: sasPopupPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes sasPopupPop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

.sas-popup-icon-warning {
    background: #FEF3C7;
    color: #D97706;
    box-shadow: 0 0 0 8px rgba(254, 243, 199, 0.5);
}

.sas-popup-icon-danger {
    background: #FEE2E2;
    color: #DC2626;
    box-shadow: 0 0 0 8px rgba(254, 226, 226, 0.5);
}

.sas-popup-icon-success {
    background: #D1FAE5;
    color: #059669;
    box-shadow: 0 0 0 8px rgba(209, 250, 229, 0.5);
}

.sas-popup-icon-info {
    background: #EEF2FF;
    color: #4657D9;
    box-shadow: 0 0 0 8px rgba(238, 242, 255, 0.5);
}

.sas-popup-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: #1E293B;
    margin: 0 0 0.65rem 0;
    line-height: 1.35;
}

.sas-popup-message {
    font-size: 0.92rem;
    color: #64748B;
    line-height: 1.6;
    margin: 0 0 1.75rem 0;
    white-space: pre-line;
    word-break: break-word;
    text-align: center;
}

.sas-popup-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
}

.sas-popup-btn {
    flex: 1;
    padding: 0.8rem 1.25rem;
    border-radius: 12px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s ease;
    font-family: inherit;
}

.sas-popup-btn-cancel {
    background: #F1F5F9;
    color: #475569;
    border: 1px solid #CBD5E1;
}

.sas-popup-btn-cancel:hover {
    background: #E2E8F0;
    color: #1E293B;
}

.sas-popup-btn-confirm-danger {
    background: #DC2626;
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
}

.sas-popup-btn-confirm-danger:hover {
    background: #B91C1C;
    transform: translateY(-1px);
}

.sas-popup-btn-confirm-warning {
    background: #D97706;
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(217, 119, 6, 0.35);
}

.sas-popup-btn-confirm-warning:hover {
    background: #B45309;
    transform: translateY(-1px);
}

.sas-popup-btn-confirm-primary {
    background: #4657D9;
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(70, 87, 217, 0.35);
}

.sas-popup-btn-confirm-primary:hover {
    background: #3644B2;
    transform: translateY(-1px);
}

.sas-popup-btn-confirm-success {
    background: #059669;
    color: #ffffff;

}

.sas-popup-btn-confirm-success:hover {

/* Toast Container & Cards */
.sas-toast-container {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 1000000;
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
    max-width: 420px;
    width: calc(100% - 48px);
}

.sas-toast-item {
    background: #ffffff;
    color: #1E293B;
    border-radius: 14px;
    padding: 14px 18px;
    box-shadow: 0 15px 35px -5px rgba(15, 23, 42, 0.2), 0 0 0 1px rgba(226, 232, 240, 0.8);
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.9rem;
    font-weight: 600;
    pointer-events: auto;
    opacity: 0;
    transform: translateX(40px) scale(0.95);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
}

.sas-toast-item.show {
    opacity: 1;
    transform: translateX(0) scale(1);
}

.sas-toast-icon {
    font-size: 1.4rem;
    flex-shrink: 0;
}

.sas-toast-item.toast-success .sas-toast-icon { color: #059669; }
.sas-toast-item.toast-danger .sas-toast-icon { color: #DC2626; }
.sas-toast-item.toast-warning .sas-toast-icon { color: #D97706; }
.sas-toast-item.toast-info .sas-toast-icon { color: #4657D9; }

.sas-toast-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    background: currentColor;
    opacity: 0.4;
    width: 100%;
    animation: sasToastProgress 3.5s linear forwards;
}

@keyframes sasToastProgress {
    from { width: 100%; }
    to { width: 0%; }
}
