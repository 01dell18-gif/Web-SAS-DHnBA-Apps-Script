<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Ujian & Redaksi - <?= (settings && settings.nama_sekolah) ? settings.nama_sekolah : 'SMK NEGERI FYJ Channel' ?></title>
    <?!= include('StyleCSS'); ?>
</head>
<body>
<?!= include('Header'); ?>

<div class="admin-sidebar-layout">
    <?!= include('Sidebar'); ?>
    <main class="admin-main">
        <div style="margin-bottom: 1.5rem;">
            <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-heading); margin: 0;">Template Ujian & Redaksi Berita Acara</h1>
            <p style="font-size: 0.875rem; color: var(--text-muted); margin: 0.25rem 0 0 0;">Pengaturan redaksi resmi Berita Acara dengan sistem chip placeholder dinamis</p>
        </div>

        <form id="formTemplateUjian" onsubmit="handleSaveTemplate(event)">
            <input type="hidden" id="template_id" value="1">
            <div class="card" style="margin-bottom: 1.5rem;">
                <div class="card-header">
                    <span class="card-title"><i class="bi bi-file-earmark-code"></i> Konfigurasi Template Aktif</span>
                </div>
                <div class="card-body">
                    <div class="grid-2">
                        <div class="form-group">
                            <label class="form-label" for="tpl_nama_ujian">Nama Ujian Resmi <span class="required">*</span></label>
                            <input type="text" id="tpl_nama_ujian" class="form-control" value="Sumatif Akhir Semester (SAS) Ganjil" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="tpl_tahun_ajaran">Tahun Ajaran <span class="required">*</span></label>
                            <input type="text" id="tpl_tahun_ajaran" class="form-control" value="2026/2027" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="tpl_judul_ba">Judul Dokumen Berita Acara</label>
                        <textarea id="tpl_judul_ba" class="form-control" rows="2">BERITA ACARA 
PENYELENGGARAAN SUMATIF AKHIR SEMESTER (SAS) GANJIL
TAHUN AJARAN [tahun_ajaran]</textarea>
                    </div>

                    <!-- Palet Chip Placeholder -->
                    <div class="form-group">
                        <label class="form-label">Palet Variabel / Chip Dinamis (Klik untuk Sisipkan ke Teks Redaksi)</label>
                        <div style="display: flex; flex-wrap: wrap; gap: 0.35rem;">
                            <button type="button" class="btn btn-secondary btn-sm" onclick="insertTag('[hari]')" style="font-size: 0.75rem;">+ [hari]</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="insertTag('[tanggal]')" style="font-size: 0.75rem;">+ [tanggal]</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="insertTag('[bulan]')" style="font-size: 0.75rem;">+ [bulan]</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="insertTag('[tahun]')" style="font-size: 0.75rem;">+ [tahun]</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="insertTag('[nama_ujian]')" style="font-size: 0.75rem;">+ [nama_ujian]</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="insertTag('[tahun_ajaran]')" style="font-size: 0.75rem;">+ [tahun_ajaran]</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="insertTag('[sekolah]')" style="font-size: 0.75rem;">+ [sekolah]</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="insertTag('[kelas]')" style="font-size: 0.75rem;">+ [kelas]</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="insertTag('[mata_pelajaran]')" style="font-size: 0.75rem;">+ [mata_pelajaran]</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="insertTag('[ruang]')" style="font-size: 0.75rem;">+ [ruang]</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="insertTag('[jam_mulai]')" style="font-size: 0.75rem;">+ [jam_mulai]</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="insertTag('[jam_selesai]')" style="font-size: 0.75rem;">+ [jam_selesai]</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="insertTag('[peserta_seharusnya]')" style="font-size: 0.75rem;">+ [peserta_seharusnya]</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="insertTag('[peserta_hadir]')" style="font-size: 0.75rem;">+ [peserta_hadir]</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="insertTag('[peserta_tidak_hadir]')" style="font-size: 0.75rem;">+ [peserta_tidak_hadir]</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="insertTag('[catatan_pelaksanaan]')" style="font-size: 0.75rem;">+ [catatan_pelaksanaan]</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="tpl_redaksi_isi">Format Teks Redaksi Isi Berita Acara (HTML / Text)</label>
                        <textarea id="tpl_redaksi_isi" class="form-control" rows="8" style="font-family: monospace; font-size: 0.85rem;" oninput="updateSimulasiPreview()"></textarea>
                    </div>

                    <!-- Pratinjau Simulasi -->
                    <div style="background: var(--slate-50); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1.25rem; margin-top: 1rem;">
                        <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-heading); display: block; margin-bottom: 0.5rem;">
                            <i class="bi bi-eye"></i> Simulasi Tampilan Redaksi di Kertas A4:
                        </span>
                        <div id="simulasiPreviewBox" style="font-family: 'Times New Roman', serif; font-size: 10.5pt; line-height: 1.5; color: #000000; background: #ffffff; padding: 1rem; border: 1px solid #cbd5e1; border-radius: 4px;"></div>
                    </div>

                    <div style="margin-top: 1.5rem;">
                        <button type="submit" id="btnSaveTemplate" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Simpan Perubahan Template
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </main>
</div>

<?!= include('Modals'); ?>
<?!= include('AppJS'); ?>

<script>
document.addEventListener('DOMContentLoaded', function() {
    google.script.run
        .withSuccessHandler(function(data) {
            window.AppStore.data = data;
            var tpl = (data.templates && data.templates[0]) || {};
            document.getElementById('template_id').value = tpl.id || 1;
            document.getElementById('tpl_nama_ujian').value = tpl.nama_ujian || 'Sumatif Akhir Semester (SAS) Ganjil';
            document.getElementById('tpl_tahun_ajaran').value = tpl.tahun_ajaran || '2026/2027';
            document.getElementById('tpl_judul_ba').value = tpl.judul_berita_acara || '';
            document.getElementById('tpl_redaksi_isi').value = tpl.redaksi_isi || '';
            updateSimulasiPreview();
        })
        .apiGetInitialData();
});

function insertTag(tag) {
    var textarea = document.getElementById('tpl_redaksi_isi');
    var start = textarea.selectionStart;
    var end = textarea.selectionEnd;
    var text = textarea.value;
    textarea.value = text.substring(0, start) + tag + text.substring(end);
    textarea.focus();
    textarea.selectionStart = textarea.selectionEnd = start + tag.length;
    updateSimulasiPreview();
}

function updateSimulasiPreview() {
    var raw = document.getElementById('tpl_redaksi_isi').value;
    var sim = raw
        .replace(/\[hari\]/g, 'Senin')
        .replace(/\[tanggal\]/g, '14')
        .replace(/\[tanggal_teks\]/g, 'empat belas')
        .replace(/\[bulan\]/g, 'Oktober')
        .replace(/\[tahun\]/g, '2026')
        .replace(/\[tahun_teks\]/g, 'dua ribu dua puluh enam')
        .replace(/\[nama_ujian\]/g, 'Sumatif Akhir Semester (SAS) Ganjil')
        .replace(/\[tahun_ajaran\]/g, '2026/2027')
        .replace(/\[sekolah\]/g, 'SMK NEGERI FYJ Channel')
        .replace(/\[kelas\]/g, 'XII DKV')
        .replace(/\[mata_pelajaran\]/g, 'Desain Komunikasi Visual')
        .replace(/\[ruang\]/g, 'Lab 1')
        .replace(/\[jam_mulai\]/g, '07:30')
        .replace(/\[jam_selesai\]/g, '09:30')
        .replace(/\[peserta_seharusnya\]/g, '32')
        .replace(/\[peserta_hadir\]/g, '32')
        .replace(/\[peserta_tidak_hadir\]/g, '0')
        .replace(/\[blangko_berita_acara\]/g, '1')
        .replace(/\[blangko_daftar_hadir\]/g, '1')
        .replace(/\[catatan_pelaksanaan\]/g, 'Pelaksanaan ujian berjalan tertib dan lancar.');

    document.getElementById('simulasiPreviewBox').innerHTML = sim;
}

function handleSaveTemplate(e) {
    e.preventDefault();
    var btn = document.getElementById('btnSaveTemplate');
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Menyimpan...';

    var payload = {
        id: document.getElementById('template_id').value,
        nama_ujian: document.getElementById('tpl_nama_ujian').value.trim(),
        tahun_ajaran: document.getElementById('tpl_tahun_ajaran').value.trim(),
        judul_berita_acara: document.getElementById('tpl_judul_ba').value,
        redaksi_isi: document.getElementById('tpl_redaksi_isi').value,
        aktif: 1
    };

    google.script.run
        .withSuccessHandler(function() {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-check-circle"></i> Simpan Perubahan Template';
            showGlobalNotificationDialog('Berhasil', 'Template ujian dan redaksi berhasil disimpan.', 'success');
        })
        .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-check-circle"></i> Simpan Perubahan Template';
            showGlobalNotificationDialog('Gagal', err.message, 'danger');
        })
        .apiSaveTemplate(payload);
}
</script>
</body>
</html>
