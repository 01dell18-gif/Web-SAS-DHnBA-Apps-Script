<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Daftar Hadir - <?= (settings && settings.nama_sekolah) ? settings.nama_sekolah : 'SMK NEGERI FYJ Channel' ?></title>
    <?!= include('StyleCSS'); ?>
</head>
<body>
<?!= include('Header'); ?>

<div class="admin-sidebar-layout">
    <?!= include('Sidebar'); ?>
    <main class="admin-main">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-heading); margin: 0;">Arsip Daftar Hadir Ujian</h1>
                <p style="font-size: 0.875rem; color: var(--text-muted); margin: 0.25rem 0 0 0;">Daftar presensi ujian resmi yang tersimpan di database sistem</p>
            </div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <button type="button" class="btn btn-secondary btn-sm" onclick="exportArsipExcel()">
                    <i class="bi bi-file-earmark-excel"></i> Ekspor Rekap Excel
                </button>
                <button type="button" class="btn btn-danger-soft btn-sm" onclick="confirmResetAllArsip()">
                    <i class="bi bi-trash3"></i> Reset Hapus Semua Arsip
                </button>
            </div>
        </div>

        <!-- Filter Mendatar -->
        <div class="horizontal-filter-card">
            <div class="horizontal-filter-item">
                <label>Pencarian</label>
                <input type="text" id="filterKeyword" class="form-control form-control-sm" placeholder="Mata pelajaran, pengawas, ruang..." oninput="filterArsipTable()">
            </div>
            <div class="horizontal-filter-item" style="max-width: 170px;">
                <label>Tanggal Ujian</label>
                <input type="date" id="filterTanggal" class="form-control form-control-sm" onchange="filterArsipTable()">
            </div>
            <div class="horizontal-filter-item" style="max-width: 180px;">
                <label>Kelas</label>
                <select id="filterKelas" class="form-select form-select-sm" onchange="filterArsipTable()">
                    <option value="">Semua Kelas</option>
                </select>
            </div>
        </div>

        <div class="card">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                <span class="card-title"><i class="bi bi-clipboard-check"></i> Riwayat Daftar Hadir Terarsip</span>
                <span id="badgeTotalArsip" class="badge" style="background:#e0e7ff; color:#4338ca; font-weight:700;">0 Berkas</span>
            </div>
            <div class="table-responsive">
                <table class="table" style="font-size: 0.875rem;">
                    <thead>
                        <tr>
                            <th style="width: 35px;">No</th>
                            <th>Tanggal</th>
                            <th>Kelas</th>
                            <th>Mata Pelajaran</th>
                            <th>Sesi / Ruang</th>
                            <th style="text-align: center;">Kehadiran (H/D/I/S/A)</th>
                            <th>Pengawas 1</th>
                            <th style="text-align: center; width: 120px;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableArsipBody">
                        <tr><td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-muted);"><i class="bi bi-arrow-repeat spin"></i> Memuat berkas...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<?!= include('Modals'); ?>
<?!= include('AppJS'); ?>

<script>
var arsipList = [];

onDocumentReady(function() {
    loadArsipData();
});

function loadArsipData() {
    google.script.run
        .withSuccessHandler(function(data) {
            window.AppStore.data = data;
            arsipList = (data && data.absensi) || [];

            var filterKelas = document.getElementById('filterKelas');
            if (filterKelas) {
                filterKelas.innerHTML = '<option value="">Semua Rombel</option>';
                ((data && data.classes) || []).forEach(function(c) {
                    var opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.nama_kelas;
                    filterKelas.appendChild(opt);
                });
            }

            filterArsipTable();
        })
        .apiGetInitialData();
}

function filterArsipTable() {
    var kw = document.getElementById('filterKeyword').value.trim().toLowerCase();
    var tgl = document.getElementById('filterTanggal').value;
    var cid = document.getElementById('filterKelas').value;

    var filtered = arsipList.filter(function(a) {
        if (kw) {
            var matchKw = (a.mata_pelajaran && a.mata_pelajaran.toLowerCase().indexOf(kw) !== -1) ||
                          (a.nama_pengawas_1 && a.nama_pengawas_1.toLowerCase().indexOf(kw) !== -1) ||
                          (a.ruang && a.ruang.toLowerCase().indexOf(kw) !== -1);
            if (!matchKw) return false;
        }
        if (tgl && a.tanggal_ujian !== tgl) return false;
        if (cid && String(a.class_id) !== String(cid)) return false;
        return true;
    });

    renderArsipTable(filtered);
}

function renderArsipTable(items) {
    var tbody = document.getElementById('tableArsipBody');
    document.getElementById('badgeTotalArsip').textContent = items.length + ' Berkas';

    if (!items || items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-muted);">Tidak ada berkas daftar hadir.</td></tr>';
        return;
    }

    var html = '';
    items.forEach(function(a, idx) {
        var counts = (a.peserta_hadir || 0) + ' / ' + (a.peserta_dispensasi || 0) + ' / ' + (a.peserta_izin || 0) + ' / ' + (a.peserta_sakit || 0) + ' / ' + (a.peserta_tidak_hadir || 0);

        html += '<tr>' +
            '<td>' + (idx + 1) + '</td>' +
            '<td>' + (a.tanggal_ujian || '-') + '</td>' +
            '<td><strong>' + (a.nama_kelas || '-') + '</strong></td>' +
            '<td>' + (a.mata_pelajaran || '-') + '</td>' +
            '<td>Sesi ' + (a.sesi || '1') + ' / ' + (a.ruang || '-') + '</td>' +
            '<td style="text-align: center;"><span class="badge" style="background:#f1f5f9; color:#1e293b; font-weight:700;">' + counts + '</span></td>' +
            '<td>' + (a.nama_pengawas_1 || '-') + '</td>' +
            '<td style="text-align: center; white-space: nowrap;">' +
            '<a href="' + window.APP_URL + '?page=preview&type=absensi&id=' + a.id + '" target="_blank" class="btn btn-secondary btn-sm" title="Pratinjau A4 Tab Baru" style="padding: 2px 7px;"><i class="bi bi-eye"></i></a> ' +
            '<button type="button" class="btn btn-danger-soft btn-sm" onclick="deleteArsip(' + a.id + ')" title="Hapus Berkas" style="padding: 2px 7px;"><i class="bi bi-trash"></i></button>' +
            '</td>' +
            '</tr>';
    });
    tbody.innerHTML = html;
}

function deleteArsip(id) {
    showGlobalConfirmDialog(
        'Konfirmasi Hapus Berkas',
        'Apakah Anda yakin ingin menghapus arsip Daftar Hadir ini?',
        function() {
            google.script.run
                .withSuccessHandler(function() {
                    showGlobalNotificationDialog('Berhasil', 'Arsip Daftar Hadir berhasil dihapus.', 'success');
                    loadArsipData();
                })
                .apiDeleteAbsensi(id);
        },
        'Hapus',
        true
    );
}

function confirmResetAllArsip() {
    showConfirmResetModal(
        function() {
            google.script.run
                .withSuccessHandler(function() {
                    showGlobalNotificationDialog('Berhasil', 'Seluruh arsip Daftar Hadir berhasil dikosongkan.', 'success');
                    loadArsipData();
                })
                .apiDeleteAllAbsensi();
        },
        'Reset Hapus Semua Arsip Daftar Hadir',
        'Tindakan ini akan mengosongkan seluruh riwayat presensi daftar hadir. Apakah Anda yakin ingin melanjutkan?'
    );
}

function exportArsipExcel() {
    var filename = 'Rekap_Arsip_Daftar_Hadir_' + new Date().toISOString().split('T')[0] + '.xlsx';
    var headers = ['No', 'Tanggal', 'Kelas', 'Mata Pelajaran', 'Sesi', 'Ruang', 'Hadir', 'Dispensasi', 'Izin', 'Sakit', 'Tidak Hadir', 'Total Peserta', 'Pengawas 1', 'NIP 1'];
    var rows = [];
    arsipList.forEach(function(a, idx) {
        rows.push([
            idx + 1, a.tanggal_ujian, a.nama_kelas, a.mata_pelajaran, a.sesi || '1', a.ruang || '-',
            a.peserta_hadir || 0, a.peserta_dispensasi || 0, a.peserta_izin || 0, a.peserta_sakit || 0, a.peserta_tidak_hadir || 0,
            a.total_peserta || 0, a.nama_pengawas_1, a.nip_pengawas_1 || '-'
        ]);
    });
    downloadExcelXLS(filename, headers, rows);
}
</script>
</body>
</html>
