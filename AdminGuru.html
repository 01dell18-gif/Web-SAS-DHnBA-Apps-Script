<script>
var guruList = [];
var initialServerData = <?!= (typeof serverData !== 'undefined' && serverData) ? JSON.stringify(serverData) : 'null' ?>;

function initGuruPage() {
    if (initialServerData && initialServerData.teachers && initialServerData.teachers.length > 0) {
        window.AppStore.data = initialServerData;
        guruList = initialServerData.teachers;
        renderGuruTable(guruList);
    } else {
        loadGuruData();
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGuruPage);
} else {
    initGuruPage();
}

function loadGuruData(isRetry) {
    var tbody = document.getElementById('tableGuruBody');
    if (tbody && (!guruList || guruList.length === 0)) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem; color: var(--text-muted);"><div class="spinner-border spinner-border-sm" role="status"></div> Memuat data guru & pengawas...</td></tr>';
    }
    google.script.run
        .withSuccessHandler(function(data) {
            if (!data || data.success === false) {
                var errMsg = (data && data.error) ? data.error : 'Terjadi kegagalan mengambil data dari spreadsheet.';
                if (tbody && (!guruList || guruList.length === 0)) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem;">' +
                        '<div style="color: #e11d48; font-weight: 700; margin-bottom: 0.5rem;"><i class="bi bi-exclamation-triangle-fill"></i> Gagal Memuat Data Guru</div>' +
                        '<div style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">' + errMsg + '</div>' +
                        '<button type="button" class="btn btn-primary btn-sm" onclick="loadGuruData()"><i class="bi bi-arrow-clockwise"></i> Coba Muat Ulang</button>' +
                        '</td></tr>';
                }
                showGlobalToast(errMsg, 'danger');
                return;
            }
            window.AppStore.data = data;
            guruList = (data && data.teachers) || [];
            renderGuruTable(guruList);
        })
        .withFailureHandler(function(err) {
            if (tbody && (!guruList || guruList.length === 0)) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem;">' +
                    '<div style="color: #e11d48; font-weight: 700; margin-bottom: 0.5rem;"><i class="bi bi-exclamation-triangle-fill"></i> Gagal memuat data guru</div>' +
                    '<div style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">' + (err && err.message ? err.message : err) + '</div>' +
                    '<button type="button" class="btn btn-primary btn-sm" onclick="loadGuruData()"><i class="bi bi-arrow-clockwise"></i> Coba Muat Ulang</button>' +
                    '</td></tr>';
            }
            showGlobalToast('Gagal memuat data guru: ' + (err && err.message ? err.message : err), 'danger');
        })
        .apiGetInitialData();
}

function renderGuruTable(teachers) {
    var tbody = document.getElementById('tableGuruBody');
    if (!teachers || teachers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2.5rem 1rem; color: var(--text-muted);">' +
            '<div style="font-size: 1.05rem; font-weight: 700; color: #334155; margin-bottom: 0.5rem;"><i class="bi bi-person-workspace" style="font-size: 2rem; display: block; margin-bottom: 0.5rem; color: #94a3b8;"></i>Belum ada data guru & pengawas di database</div>' +
            '<p style="font-size: 0.85rem; margin-bottom: 1rem;">Data guru di spreadsheet masih kosong. Anda dapat menginisialisasi 10 dewan guru resmi secara otomatis.</p>' +
            '<button type="button" class="btn btn-primary btn-sm" onclick="reseedAllMasterTables(loadGuruData)"><i class="bi bi-magic"></i> Inisialisasi Data Master Default (10 Guru & Pengawas)</button>' +
            '</td></tr>';
        return;
    }

    var html = '';
    teachers.forEach(function(g, idx) {
        var isActive = (String(g.aktif) === '1' || g.aktif === true || g.aktif == 1);
        var stBadge = '<button type="button" class="status-toggle-btn" onclick="toggleUniversalMasterStatus(\'guru\', ' + g.id + ', ' + (isActive ? 1 : 0) + ', this)" title="Klik untuk mengubah status Guru Aktif / Nonaktif">' +
            '<span class="status-pill-badge ' + (isActive ? 'is-active' : 'is-inactive') + '">' +
            '<i class="bi ' + (isActive ? 'bi-check-circle-fill' : 'bi-x-circle-fill') + '"></i> ' +
            '<span>' + (isActive ? 'Aktif' : 'Nonaktif') + '</span>' +
            '</span></button>';

        html += '<tr>' +
            '<td>' + (idx + 1) + '</td>' +
            '<td><strong>' + g.nama + '</strong></td>' +
            '<td>' + (g.nip || '-') + '</td>' +
            '<td>' + (g.jabatan || 'Guru / Pengawas') + '</td>' +
            '<td style="text-align: center;">' + stBadge + '</td>' +
            '<td style="text-align: center; white-space: nowrap;">' +
            '<button type="button" class="btn btn-secondary btn-sm" onclick="editGuru(' + g.id + ')" title="Edit Guru" style="padding: 2px 7px;"><i class="bi bi-pencil-square"></i></button> ' +
            '<button type="button" class="btn btn-danger-soft btn-sm" onclick="deleteGuru(' + g.id + ', \'' + g.nama + '\')" title="Hapus Guru" style="padding: 2px 7px;"><i class="bi bi-trash"></i></button>' +
            '</td>' +
            '</tr>';
    });
    tbody.innerHTML = html;
}

function filterGuruTable() {
    var q = document.getElementById('searchGuru').value.trim().toLowerCase();
    var filtered = guruList.filter(function(g) {
        return (g.nama && g.nama.toLowerCase().indexOf(q) !== -1) ||
               (g.nip && String(g.nip).indexOf(q) !== -1);
    });
    renderGuruTable(filtered);
}

function openGuruModal() {
    document.getElementById('modalGuruTitle').textContent = 'Tambah Guru Baru';
    document.getElementById('guru_id').value = '';
    document.getElementById('guru_nama').value = '';
    document.getElementById('guru_nip').value = '';
    document.getElementById('guru_jabatan').value = 'Guru / Pengawas';
    document.getElementById('guru_aktif').checked = true;
    document.getElementById('modalFormGuru').style.display = 'flex';
}

function editGuru(id) {
    var g = guruList.find(function(item) { return String(item.id) === String(id); });
    if (!g) return;
    document.getElementById('modalGuruTitle').textContent = 'Edit Data Guru';
    document.getElementById('guru_id').value = g.id;
    document.getElementById('guru_nama').value = g.nama;
    document.getElementById('guru_nip').value = g.nip || '';
    document.getElementById('guru_jabatan').value = g.jabatan || 'Guru / Pengawas';
    document.getElementById('guru_aktif').checked = (String(g.aktif) === '1' || g.aktif === true);
    document.getElementById('modalFormGuru').style.display = 'flex';
}

function closeGuruModal() {
    document.getElementById('modalFormGuru').style.display = 'none';
}

function handleSaveGuru(e) {
    e.preventDefault();
    var id = document.getElementById('guru_id').value;
    var nama = document.getElementById('guru_nama').value.trim();
    var btn = document.getElementById('btnSaveGuru');
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Menyimpan...';

    var payload = {
        id: id || null,
        nama: nama,
        nip: document.getElementById('guru_nip').value.trim() || '-',
        jabatan: document.getElementById('guru_jabatan').value.trim() || 'Guru / Pengawas',
        aktif: document.getElementById('guru_aktif').checked ? 1 : 0
    };

    google.script.run
        .withSuccessHandler(function() {
            btn.disabled = false;
            btn.innerHTML = 'Simpan Data';
            closeGuruModal();
            showGlobalNotificationDialog('Berhasil', 'Data guru ' + nama + ' berhasil disimpan.', 'success');
            loadGuruData();
        })
        .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerHTML = 'Simpan Data';
            showGlobalNotificationDialog('Gagal', err.message, 'danger');
        })
        .apiSaveGuru(payload);
}

function deleteGuru(id, nama) {
    showGlobalConfirmDialog(
        'Konfirmasi Hapus Guru',
        'Apakah Anda yakin ingin menghapus data pendidik ' + nama + '?',
        function() {
            google.script.run
                .withSuccessHandler(function() {
                    showGlobalNotificationDialog('Berhasil', 'Guru ' + nama + ' berhasil dihapus.', 'success');
                    loadGuruData();
                })
                .apiDeleteGuru(id);
        },
        'Hapus',
        true
    );
}

function confirmResetAllGuru() {
    showConfirmResetModal(
        function() {
            google.script.run
                .withSuccessHandler(function() {
                    showGlobalNotificationDialog('Berhasil', 'Seluruh data guru telah dikosongkan.', 'success');
                    loadGuruData();
                })
                .apiDeleteAllGuru();
        },
        'Reset Hapus Semua Guru',
        'Tindakan ini akan mengosongkan seluruh master dewan guru. Apakah Anda yakin ingin melanjutkan?'
    );
}

function exportGuruExcel() {
    var filename = 'Data_Guru_Pengawas_' + new Date().toISOString().split('T')[0] + '.xlsx';
    var headers = ['No', 'Nama Lengkap Guru / Pengawas', 'NIP', 'Jabatan', 'Status'];
    var rows = [];
    guruList.forEach(function(g, idx) {
        var st = (String(g.aktif) === '1' || g.aktif === true) ? 'Aktif' : 'Nonaktif';
        rows.push([idx + 1, g.nama, g.nip || '-', g.jabatan || 'Guru / Pengawas', st]);
    });
    downloadExcelXLS(filename, headers, rows);
}
</script>
