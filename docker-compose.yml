version: '3.8'

services:
  web-sas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-sas-app
    restart: unless-stopped
    ports:
      - "3003:3003"
    volumes:
      # Persistent volume: database JSON & SQL tetap tersimpan di host
      - ./data:/app/data
      # Persistent volume: logo sekolah yang diunggah tetap tersimpan di host
      - ./public/assets/img:/app/public/assets/img
    environment:
      - NODE_ENV=production
      - PORT=3003
