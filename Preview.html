onDocumentReady(function() {

    var type = serverType || urlParams.get('type') || 'absensi';
    var id = serverId || urlParams.get('id');

    google.script.run
        .withSuccessHandler(function(data) {
            window.AppStore.data = data;
            renderDocument(type, id);
        })
        .apiGetInitialData();
});

function formatIndoDate(dateStr) {
    if (!dateStr) return '-';
    var d = null;
    if (typeof dateStr === 'string') {
        var m = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) {
            d = new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
        } else {
            d = new Date(dateStr);
        }
    } else if (dateStr instanceof Date) {
        d = dateStr;
    }
    if (!d || isNaN(d.getTime())) return String(dateStr);
    var days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    var months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    var dayName = days[d.getDay()] || '';
    var monthName = months[d.getMonth()] || '';
    return dayName + ', ' + d.getDate() + ' ' + monthName + ' ' + d.getFullYear();
}

function formatTimeStr(val) {
    if (!val) return '';
    var s = String(val).trim();
    var m = s.match(/(\d{1,2}):(\d{2})/);
    if (m) {
        return (m[1].length === 1 ? '0' + m[1] : m[1]) + ':' + m[2];
    }
    return s;
}
