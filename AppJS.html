// Universal Navigation Helpers for Google Apps Script Web App
function getAppUrl() {
    try {
        if (document.referrer && document.referrer.indexOf('script.google.com') !== -1) {
            return document.referrer.split('?')[0].split('#')[0];
        }
    } catch (e) {}

    try {
        if (window.top && window.top.location && window.top.location.href && window.top.location.href.indexOf('script.google.com') !== -1) {
            return window.top.location.href.split('?')[0].split('#')[0];
        }
    } catch (e) {}

    try {
        if (window.location && window.location.href && window.location.href.indexOf('script.google.com') !== -1) {
            return window.location.href.split('?')[0].split('#')[0];
        }
    } catch (e) {}

    if (typeof window.APP_URL === 'string' && window.APP_URL.indexOf('script.google.com') !== -1) {
        return window.APP_URL.split('?')[0].split('#')[0];
    }

    return '';
}
window.getAppUrl = getAppUrl;

function navigateTo(page, params) {
    var baseUrl = getAppUrl();
    var query = '?page=' + encodeURIComponent(page);
    if (params && typeof params === 'object') {
        for (var k in params) {
            if (params.hasOwnProperty(k)) {
                query += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
            }
        }
    }

    var targetUrl = (baseUrl ? baseUrl : '') + query;

    // WAJIB: Navigasi jendela teratas (_top) agar tidak terkena sandbox/X-Frame-Options/Drive 404
    try {
        if (window.top && window.top !== window) {
            window.top.location.href = targetUrl;
            return;
        }
    } catch (e) {}

    try {
        window.open(targetUrl, '_top');
        return;
    } catch (e) {}

    window.location.href = targetUrl;
}
window.navigateTo = navigateTo;

function openAdminPortal() {
    var isAuth = localStorage.getItem('sas_admin_auth') === '1';
    if (isAuth) {
        navigateTo('dashboard');
    } else {
        navigateTo('login');
    }
}
window.openAdminPortal = openAdminPortal;

// Simple Signature Pad Class
class SimpleSignaturePad {
  constructor(canvas, options = {}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.strokeColor = options.strokeColor || '#000000';
    this.lineWidth = options.lineWidth || 2;
    this.onChange = options.onChange || null;

    this.isDrawing = false;
    this.hasDrawn = false;
    this.initCanvas();
    this.bindEvents();
  }

  initCanvas() {
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    const rect = this.canvas.getBoundingClientRect();
    const width = rect.width || this.canvas.offsetWidth || 300;
    const height = rect.height || this.canvas.offsetHeight || 140;

    this.canvas.width = width * ratio;
    this.canvas.height = height * ratio;
    this.ctx.scale(ratio, ratio);

    this.ctx.strokeStyle = this.strokeColor;
    this.ctx.lineWidth = this.lineWidth;
    this.ctx.lineCap = 'round';
    this.ctx.lineJoin = 'round';
  }

  getPos(event) {
    const rect = this.canvas.getBoundingClientRect();
    let clientX, clientY;
    if (event.touches && event.touches.length > 0) {
      clientX = event.touches[0].clientX;
      clientY = event.touches[0].clientY;
    } else {
      clientX = event.clientX;
      clientY = event.clientY;
    }
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  bindEvents() {
    const start = (e) => {
      e.preventDefault();
      this.isDrawing = true;
      this.hasDrawn = true;
      const pos = this.getPos(e);
      this.ctx.beginPath();
      this.ctx.moveTo(pos.x, pos.y);
    };

    const move = (e) => {
      if (!this.isDrawing) return;
      e.preventDefault();
      const pos = this.getPos(e);
      this.ctx.lineTo(pos.x, pos.y);
      this.ctx.stroke();
    };

    const stop = (e) => {
      if (this.isDrawing) {
        this.isDrawing = false;
        this.ctx.closePath();
        if (this.onChange) this.onChange(this.toDataURL());
      }
    };

    this.canvas.addEventListener('mousedown', start);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', stop);

    this.canvas.addEventListener('touchstart', start, { passive: false });
    this.canvas.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('touchend', stop);
  }

  clear() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.hasDrawn = false;
    if (this.onChange) this.onChange('');
  }

  isEmpty() {
    return !this.hasDrawn;
  }

  toDataURL() {
    return this.hasDrawn ? this.canvas.toDataURL('image/png') : '';
  }
}

// Global UI Navigation Handlers
window.toggleSidebarGroup = function(button, event) {
  if (event) {
    try { event.preventDefault(); event.stopPropagation(); } catch (e) {}
  }
  var btn = button || this;
  if (!btn) return false;
  var group = btn.closest('.sidebar-nav-group');
  if (group) {
    group.classList.toggle('is-open');
  }
  return false;
};

window.toggleAdminSidebar = function(event) {
  if (event) {
    try { event.preventDefault(); event.stopPropagation(); } catch (e) {}
  }
  if (window.innerWidth <= 900) {
    document.body.classList.toggle('mobile-sidebar-open');
  } else {
    document.body.classList.toggle('sidebar-collapsed');
    try {
      var isCollapsed = document.body.classList.contains('sidebar-collapsed');
      localStorage.setItem('admin_sidebar_collapsed', isCollapsed ? 'true' : 'false');
    } catch (err) {}
  }
  return false;
};

window.toggleMobileNav = function(event) {
  if (event) {
    try { event.preventDefault(); } catch (e) {}
  }
  var nav = document.getElementById('navLinks');
  if (nav) nav.classList.toggle('is-open');
};

// Global Cache & Storage Reset
window.hapusCacheWeb = function(event) {
  if (event) {
    try { event.preventDefault(); event.stopPropagation(); } catch (e) {}
  }
  var btn = document.getElementById('btnHapusCacheWeb');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i>';
  }
  try {
    sessionStorage.clear();
    var preserve = ['sas_admin_auth', 'sas_admin_user', 'sas_admin_role', 'admin_sidebar_collapsed'];
    for (var i = localStorage.length - 1; i >= 0; i--) {
      var k = localStorage.key(i);
      if (k && preserve.indexOf(k) === -1) localStorage.removeItem(k);
    }
  } catch (e) {}

  google.script.run
    .withSuccessHandler(function() {
      window.location.reload();
    })
    .withFailureHandler(function() {
      window.location.reload();
    })
    .apiClearCache();
};

window.logoutAdmin = function() {
  showGlobalConfirmDialog(
    'Konfirmasi Keluar (Logout)',
    'Apakah Anda yakin ingin keluar dari sesi panel admin?',
    function() {
      localStorage.removeItem('sas_admin_auth');
      localStorage.removeItem('sas_admin_user');
      localStorage.removeItem('sas_admin_role');
      navigateTo('login');
    },
    'Keluar',
    true
  );
};

// Modal System Implementations
var _pendingResetCallback = null;
window.showConfirmResetModal = function(callbackOrTitle, title, message) {
  if (typeof callbackOrTitle === 'function') {
    _pendingResetCallback = callbackOrTitle;
  } else {
    _pendingResetCallback = null;
  }
  if (title) document.getElementById('confirmResetTitle').textContent = title;
  if (message) document.getElementById('confirmResetMessage').textContent = message;
  document.getElementById('modalConfirmResetGlobal').style.display = 'flex';
};

window.closeConfirmResetModal = function() {
  _pendingResetCallback = null;
  document.getElementById('modalConfirmResetGlobal').style.display = 'none';
};

window.proceedConfirmReset = function() {
  var cb = _pendingResetCallback;
  closeConfirmResetModal();
  if (cb && typeof cb === 'function') cb();
};

var _pendingGlobalConfirmCallback = null;
window.showGlobalConfirmDialog = function(title, message, onProceed, proceedText, isDanger) {
  _pendingGlobalConfirmCallback = onProceed;
  document.getElementById('globalConfirmTitle').textContent = title || 'Konfirmasi Tindakan';
  document.getElementById('globalConfirmMessage').textContent = message || 'Apakah Anda yakin ingin melanjutkan tindakan ini?';
  
  var btn = document.getElementById('btnGlobalConfirmProceed');
  btn.textContent = proceedText || 'Lanjut';
  btn.className = isDanger ? 'btn btn-danger' : 'btn btn-primary';

  var iconBox = document.getElementById('globalConfirmIconBox');
  if (isDanger) {
    iconBox.style.background = '#fee2e2';
    iconBox.style.color = '#dc2626';
  } else {
    iconBox.style.background = '#eff6ff';
    iconBox.style.color = '#2563eb';
  }
  btn.onclick = function() {
    closeGlobalConfirmDialog();
    if (_pendingGlobalConfirmCallback) _pendingGlobalConfirmCallback();
  };
  document.getElementById('modalGlobalConfirmDialog').style.display = 'flex';
};

window.closeGlobalConfirmDialog = function() {
  _pendingGlobalConfirmCallback = null;
  document.getElementById('modalGlobalConfirmDialog').style.display = 'none';
};

window.showGlobalNotificationDialog = function(title, message, iconType) {
  document.getElementById('globalNotificationTitle').textContent = title || 'Pemberitahuan';
  document.getElementById('globalNotificationMessage').textContent = message || '';
  
  var icon = document.getElementById('globalNotificationIcon');
  var box = document.getElementById('globalNotificationIconBox');
  var card = document.getElementById('globalNotificationCard');

  if (iconType === 'success') {
    icon.className = 'bi bi-check-circle-fill';
    box.style.background = '#ecfdf5'; box.style.borderColor = '#a7f3d0'; box.style.color = '#059669';
    card.style.borderTopColor = '#10b981';
  } else if (iconType === 'danger' || iconType === 'error') {
    icon.className = 'bi bi-exclamation-triangle-fill';
    box.style.background = '#fef2f2'; box.style.borderColor = '#fecaca'; box.style.color = '#dc2626';
    card.style.borderTopColor = '#ef4444';
  } else {
    icon.className = 'bi bi-info-circle-fill';
    box.style.background = '#eff6ff'; box.style.borderColor = '#bfdbfe'; box.style.color = '#2563eb';
    card.style.borderTopColor = '#3b82f6';
  }
  document.getElementById('modalGlobalNotificationDialog').style.display = 'flex';
};

window.closeGlobalNotificationDialog = function() {
  document.getElementById('modalGlobalNotificationDialog').style.display = 'none';
};

// Universal Excel (.xls) Exporter
window.downloadExcelXLS = function(filename, headers, rows) {
  var headerRow = headers.map(function(h) {
    return '<th style="background-color: #4f46e5; color: #ffffff; font-weight: bold; padding: 8px; border: 1px solid #d1d5db;">' + (h || '') + '</th>';
  }).join('');

  var bodyRows = rows.map(function(row) {
    var cells = row.map(function(cell) {
      var val = cell !== null && cell !== undefined ? String(cell) : '';
      return '<td style="padding: 6px; border: 1px solid #e5e7eb; mso-number-format: \"@\";">' + val + '</td>';
    }).join('');
    return '<tr>' + cells + '</tr>';
  }).join('');

  var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">' +
    '<head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>' +
    '<x:Name>Sheet1</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet>' +
    '</x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>' +
    '<table border="1">' +
    '<thead><tr>' + headerRow + '</tr></thead>' +
    '<tbody>' + bodyRows + '</tbody>' +
    '</table></body></html>';

  var blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename.endsWith('.xls') ? filename : filename + '.xls';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

// Universal Photo Compressor
window.compressPhoto = function(file, callback) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var maxDim = 800;
      var w = img.width;
      var h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) {
          h = Math.round((h * maxDim) / w);
          w = maxDim;
        } else {
          w = Math.round((w * maxDim) / h);
          h = maxDim;
        }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      var compressed = canvas.toDataURL('image/jpeg', 0.72);
      callback(compressed);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
};

// Auto Initialize Header Profile Info
document.addEventListener('DOMContentLoaded', function() {
  try {
    var userJson = localStorage.getItem('sas_admin_user');
    var role = (localStorage.getItem('sas_admin_role') || 'admin').toLowerCase();
    if (userJson) {
      var u = JSON.parse(userJson);
      var nameEl = document.getElementById('headerUserName');
      if (nameEl) nameEl.textContent = u.nama_lengkap || u.username || 'Administrator';
      
      var badge = document.getElementById('headerUserRoleBadge');
      if (badge) {
        if (role === 'admin') {
          badge.className = 'badge-role-admin';
          badge.textContent = '👑 Admin';
        } else {
          badge.className = 'badge-role-operator';
          badge.textContent = '🛡️ Operator';
        }
      }

      var avatarImg = document.getElementById('headerAvatarImg');
      var avatarIcon = document.getElementById('headerAvatarIcon');
      if (u.foto && avatarImg && avatarIcon) {
        avatarImg.src = u.foto;
        avatarImg.style.display = 'block';
        avatarIcon.style.display = 'none';
      }
    }

    if (role === 'operator') {
      var adminOnly = document.querySelectorAll('.admin-only-item');
      adminOnly.forEach(function(el) { el.style.display = 'none'; });
    }
  } catch (err) {}
});
</script>
