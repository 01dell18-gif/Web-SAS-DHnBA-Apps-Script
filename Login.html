<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Admin - <?= (settings && settings.nama_sekolah) ? settings.nama_sekolah : 'SMK NEGERI FYJ Channel' ?></title>
    <?!= include('StyleCSS'); ?>
    <style>
        body {
            background: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            padding: 2.25rem 2rem;
            text-align: center;
        }
        .login-logo {
            width: 68px;
            height: 68px;
            object-fit: contain;
            margin-bottom: 1rem;
        }
        .login-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-heading);
            margin-bottom: 0.35rem;
        }
        .login-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.75rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <img referrerpolicy="no-referrer" src="<?= (settings && (settings.school_logo || settings.logo_path)) ? (settings.school_logo || settings.logo_path) : 'https://cdn-icons-png.flaticon.com/512/2997/2997295.png' ?>" alt="Logo Sekolah" class="login-logo">
    <h1 class="login-title">Panel Administrasi</h1>
    <p class="login-subtitle"><?= (settings && settings.nama_sekolah) ? settings.nama_sekolah : 'SMK NEGERI FYJ Channel' ?></p>

    <div id="loginAlert" class="alert alert-danger" style="display: none; text-align: left; font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

    <form id="formLogin" onsubmit="handleLoginSubmit(event)">
        <div class="form-group" style="text-align: left;">
            <label class="form-label" for="username">Username</label>
            <div style="position: relative;">
                <input type="text" id="username" class="form-control" placeholder="Masukkan username" required style="padding-left: 2.5rem;">
                <i class="bi bi-person" style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
            </div>
        </div>

        <div class="form-group" style="text-align: left;">
            <label class="form-label" for="password">Password</label>
            <div style="position: relative;">
                <input type="password" id="password" class="form-control" placeholder="Masukkan password" required style="padding-left: 2.5rem; padding-right: 2.5rem;">
                <i class="bi bi-lock" style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                <button type="button" onclick="togglePasswordVisibility('password', this)" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;" title="Lihat password">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
            <i class="bi bi-box-arrow-in-right"></i> Masuk ke Panel
        </button>
    </form>

    <div style="margin-top: 1.75rem; font-size: 0.825rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 1.25rem;">
        <a href="<?= appUrl ?>?page=index" target="_top" onclick="navigateTo('index'); return false;" style="color: var(--primary); text-decoration: none; font-weight: 600;">
            <i class="bi bi-arrow-left"></i> Kembali ke Beranda Publik
        </a>
    </div>
</div>

<?!= include('AppJS'); ?>
<script>
function togglePasswordVisibility(inputId, btn) {
    var inp = document.getElementById(inputId);
    var icon = btn.querySelector('i');
    if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        inp.type = 'password';
        icon.className = 'bi bi-eye';
    }
}

function handleLoginSubmit(e) {
    e.preventDefault();
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value.trim();
    var alertBox = document.getElementById('loginAlert');
    var btn = document.getElementById('btnLoginSubmit');

    alertBox.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Memeriksa kredensial...';

    google.script.run
        .withSuccessHandler(function(res) {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Masuk ke Panel';
            if (res && res.success) {
                localStorage.setItem('sas_admin_auth', '1');
                localStorage.setItem('sas_admin_user', JSON.stringify(res.user));
                localStorage.setItem('sas_admin_role', res.user.role || 'admin');
                navigateTo('dashboard');
            } else {
                alertBox.textContent = (res && res.message) ? res.message : 'Username atau password salah.';
                alertBox.style.display = 'block';
            }
        })
        .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Masuk ke Panel';
            alertBox.textContent = 'Gagal menghubungi server: ' + err.message;
            alertBox.style.display = 'block';
        })
        .apiLogin(u, p);
}
</script>
</body>
</html>
