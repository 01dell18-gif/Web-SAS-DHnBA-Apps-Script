<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrator - <?= schoolSettings.school_name || 'SMK NEGERI FYJ CHANNEL' ?></title>
    <?!= include('StyleCSS'); ?>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #4657D9 0%, #253047 100%);
            padding: 1rem;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 2.5rem;
            box-shadow: 0 16px 36px -4px rgba(37, 48, 71, 0.25);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header img {
            width: 68px;
            height: 68px;
            object-fit: contain;
            margin-bottom: 0.75rem;
            border-radius: var(--radius-sm);
            background: #fff;
            padding: 4px;
            box-shadow: var(--shadow-sm);
        }

        .login-hint {
            background: var(--slate-100);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 0.8rem;

            margin-top: 1.25rem;

        }

<body>

<div class="login-card">
    <div class="login-header">
        <img src="<?= schoolSettings.school_logo || '' ?>" alt="Logo Sekolah" id="loginLogo">
        <h2>Panel Administrator</h2>
        <p id="loginSchoolName" style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">
            <?= schoolSettings.school_name || 'SMK NEGERI FYJ CHANNEL' ?>
        </p>
    </div>

    <form id="formLogin" onsubmit="handleLogin(event)">
        <div id="loginAlert" class="alert alert-danger" style="display: none; margin-bottom: 1rem;"></div>

        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" name="username" id="username" class="form-control" placeholder="Masukkan username"
                value="admin" required autofocus>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div style="position: relative;">
                <input type="password" name="password" id="password" class="form-control"
                    placeholder="Masukkan password" value="admin123" required style="padding-right: 42px;">
                <button type="button" id="btnTogglePassword" onclick="togglePasswordVisibility('password', 'iconEye')"
                    style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; font-size: 1.1rem;"
                    title="Lihat / Sembunyikan Password" aria-label="Toggle Password">
                    <i class="bi bi-eye" id="iconEye"></i>
                </button>
            </div>
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn btn-primary btn-block"
            style="margin-top: 1.5rem; padding: 0.85rem; font-size: 0.95rem;">
            <i class="bi bi-box-arrow-in-right"></i> Masuk ke Panel Sistem
        </button>
    </form>

    <div class="login-hint">
        Akun Bawaan: <strong>admin</strong> / <strong>admin123</strong> (Admin) atau <strong>operator</strong> / <strong>operator123</strong> (Operator)
    </div>

    <div style="text-align: center; margin-top: 1.5rem;">
        <button type="button" class="btn btn-outline-primary btn-sm" onclick="navigateTo('index')">
            <i class="bi bi-arrow-left"></i> Kembali ke Beranda
        </button>
    </div>
</div>

<?!= include('AppJS'); ?>

<script>
// Jika sudah terotentikasi, langsung arahkan ke Dashboard
if (localStorage.getItem('sas_admin_auth') === '1') {
    navigateTo('dashboard');
}

function handleLogin(e) {
    e.preventDefault();
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value.trim();
    var alertEl = document.getElementById('loginAlert');
    var btnSubmit = document.getElementById('btnLoginSubmit');

    alertEl.style.display = 'none';
    btnSubmit.disabled = true;
    btnSubmit.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Memverifikasi kredensial...';

    callServer('apiLogin', u, p).then(function(res) {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Masuk ke Panel Sistem';

        if (res.success) {
            localStorage.setItem('sas_admin_auth', '1');
            localStorage.setItem('sas_admin_user', JSON.stringify(res.user));
            localStorage.setItem('sas_admin_role', (res.user.role || 'admin').toLowerCase());
            showToast('success', res.message || 'Login berhasil!');
            setTimeout(function() {
                navigateTo('dashboard');
            }, 500);
        } else {
            alertEl.textContent = res.message || 'Username atau password salah.';
            alertEl.style.display = 'block';
            showToast('danger', res.message);
        }
    }).catch(function(err) {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Masuk ke Panel Sistem';
        alertEl.textContent = 'Gagal terhubung ke Google Apps Script: ' + err.message;
        alertEl.style.display = 'block';
    });
}
</script>
</body>
</html>
