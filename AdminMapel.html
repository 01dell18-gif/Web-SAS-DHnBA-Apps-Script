<script>
var mapelList = [];
var initialServerData = <?!= (typeof serverData !== 'undefined' && serverData) ? JSON.stringify(serverData) : 'null' ?>;

function initMapelPage() {
    if (initialServerData && initialServerData.mapels && initialServerData.mapels.length > 0) {
        window.AppStore.data = initialServerData;
        mapelList = initialServerData.mapels;
        renderMapelTable(mapelList);
    }
    loadMapelData();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMapelPage);
} else {
    initMapelPage();
}

function loadMapelData(isRetry) {
    var tbody = document.getElementById('tableMapelBody');
    if (tbody && (!mapelList || mapelList.length === 0)) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem; color: var(--text-muted);"><div class="spinner-border spinner-border-sm" role="status"></div> Memuat data mapel...</td></tr>';
    }
    google.script.run
        .withSuccessHandler(function(data) {
            if (!data || data.success === false) {
                var errMsg = (data && data.error) ? data.error : 'Terjadi kegagalan mengambil data dari spreadsheet.';
                if (tbody && (!mapelList || mapelList.length === 0)) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem;">' +
                        '<div style="color: #e11d48; font-weight: 700; margin-bottom: 0.5rem;"><i class="bi bi-exclamation-triangle-fill"></i> Gagal Memuat Data Mapel</div>' +
                        '<div style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">' + errMsg + '</div>' +
                        '<button type="button" class="btn btn-primary btn-sm" onclick="loadMapelData()"><i class="bi bi-arrow-clockwise"></i> Coba Muat Ulang</button>' +
                        '</td></tr>';
                }
                showGlobalToast(errMsg, 'danger');
                return;
            }
            window.AppStore.data = data;
            mapelList = (data && data.mapels) || [];
            renderMapelTable(mapelList);
        })
        .withFailureHandler(function(err) {
            if (tbody && (!mapelList || mapelList.length === 0)) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem;">' +
                    '<div style="color: #e11d48; font-weight: 700; margin-bottom: 0.5rem;"><i class="bi bi-exclamation-triangle-fill"></i> Gagal memuat data mapel</div>' +
                    '<div style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">' + (err && err.message ? err.message : err) + '</div>' +
                    '<button type="button" class="btn btn-primary btn-sm" onclick="loadMapelData()"><i class="bi bi-arrow-clockwise"></i> Coba Muat Ulang</button>' +
                    '</td></tr>';
            }
            showGlobalToast('Gagal memuat data mapel: ' + (err && err.message ? err.message : err), 'danger');
        })
        .apiGetInitialData();
}

function renderMapelTable(mapels) {
    var tbody = document.getElementById('tableMapelBody');
    document.getElementById('badgeTotalMapel').textContent = mapels.length + ' Mapel';

    if (!mapels || mapels.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2.5rem 1rem; color: var(--text-muted);">' +
            '<div style="font-size: 1.05rem; font-weight: 700; color: #334155; margin-bottom: 0.5rem;"><i class="bi bi-book" style="font-size: 2rem; display: block; margin-bottom: 0.5rem; color: #94a3b8;"></i>Belum ada data mata pelajaran di database</div>' +
            '<p style="font-size: 0.85rem; margin-bottom: 1rem;">Data mapel di spreadsheet masih kosong. Anda dapat menginisialisasi 18 mapel resmi secara otomatis.</p>' +
            '<button type="button" class="btn btn-primary btn-sm" onclick="reseedAllMasterTables(loadMapelData)"><i class="bi bi-magic"></i> Inisialisasi Data Master Default (18 Mapel)</button>' +
            '</td></tr>';
        return;
    }

    var html = '';
    mapels.forEach(function(m, idx) {
        var isActive = (String(m.aktif) === '1' || m.aktif === true || m.aktif == 1);
        var stBadge = '<button type="button" class="status-toggle-btn" onclick="toggleUniversalMasterStatus(\'mapel\', ' + m.id + ', ' + (isActive ? 1 : 0) + ', this)" title="Klik untuk mengubah status Mapel Aktif / Nonaktif">' +
            '<span class="status-pill-badge ' + (isActive ? 'is-active' : 'is-inactive') + '">' +
            '<i class="bi ' + (isActive ? 'bi-check-circle-fill' : 'bi-x-circle-fill') + '"></i> ' +
            '<span>' + (isActive ? 'Aktif' : 'Nonaktif') + '</span>' +
            '</span></button>';
        var kelBadge = '<span class="badge" style="background:#f1f5f9; color:#475569; font-weight:600;">' + (m.kelompok || 'Kejuruan') + '</span>';

        html += '<tr>' +
            '<td>' + (idx + 1) + '</td>' +
            '<td><code>' + (m.kode_mapel || '-') + '</code></td>' +
            '<td><strong>' + m.nama_mapel + '</strong></td>' +
            '<td>' + kelBadge + '</td>' +
            '<td style="text-align: center;">' + stBadge + '</td>' +
            '<td style="text-align: center; white-space: nowrap;">' +
            '<button type="button" class="btn btn-secondary btn-sm" onclick="editMapel(' + m.id + ')" title="Edit Mapel" style="padding: 2px 7px;"><i class="bi bi-pencil-square"></i></button> ' +
            '<button type="button" class="btn btn-danger-soft btn-sm" onclick="deleteMapel(' + m.id + ', \'' + m.nama_mapel + '\')" title="Hapus Mapel" style="padding: 2px 7px;"><i class="bi bi-trash"></i></button>' +
            '</td>' +
            '</tr>';
    });
    tbody.innerHTML = html;
}

function filterMapelTable() {
    var q = document.getElementById('searchMapel').value.trim().toLowerCase();
    var kel = document.getElementById('filterMapelKelompok').value;

    var filtered = mapelList.filter(function(m) {
        if (kel && m.kelompok !== kel) return false;
        if (q) {
            var matchQ = (m.nama_mapel && m.nama_mapel.toLowerCase().indexOf(q) !== -1) ||
                         (m.kode_mapel && String(m.kode_mapel).toLowerCase().indexOf(q) !== -1);
            if (!matchQ) return false;
        }
        return true;
    });

    renderMapelTable(filtered);
}

function openMapelModal() {
    document.getElementById('modalMapelTitle').textContent = 'Tambah Mata Pelajaran';
    document.getElementById('mapel_id').value = '';
    document.getElementById('mapel_kode').value = 'MP-' + String(mapelList.length + 1).padStart(3, '0');
    document.getElementById('mapel_nama').value = '';
    document.getElementById('mapel_kelompok').value = 'Kejuruan';
    document.getElementById('mapel_aktif').checked = true;
    document.getElementById('modalFormMapel').style.display = 'flex';
}

function editMapel(id) {
    var m = mapelList.find(function(item) { return String(item.id) === String(id); });
    if (!m) return;
    document.getElementById('modalMapelTitle').textContent = 'Edit Data Mapel';
    document.getElementById('mapel_id').value = m.id;
    document.getElementById('mapel_kode').value = m.kode_mapel || '';
    document.getElementById('mapel_nama').value = m.nama_mapel;
    document.getElementById('mapel_kelompok').value = m.kelompok || 'Kejuruan';
    document.getElementById('mapel_aktif').checked = (String(m.aktif) === '1' || m.aktif === true);
    document.getElementById('modalFormMapel').style.display = 'flex';
}

function closeMapelModal() {
    document.getElementById('modalFormMapel').style.display = 'none';
}

function handleSaveMapel(e) {
    e.preventDefault();
    var id = document.getElementById('mapel_id').value;
    var nama = document.getElementById('mapel_nama').value.trim();
    var btn = document.getElementById('btnSaveMapel');
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Menyimpan...';

    var payload = {
        id: id || null,
        kode_mapel: document.getElementById('mapel_kode').value.trim(),
        nama_mapel: nama,
        kelompok: document.getElementById('mapel_kelompok').value,
        aktif: document.getElementById('mapel_aktif').checked ? 1 : 0
    };

    google.script.run
        .withSuccessHandler(function() {
            btn.disabled = false;
            btn.innerHTML = 'Simpan Mapel';
            closeMapelModal();
            showGlobalNotificationDialog('Berhasil', 'Mata pelajaran ' + nama + ' berhasil disimpan.', 'success');
            loadMapelData();
        })
        .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerHTML = 'Simpan Mapel';
            showGlobalNotificationDialog('Gagal', err.message, 'danger');
        })
        .apiSaveMapel(payload);
}

function deleteMapel(id, nama) {
    showGlobalConfirmDialog(
        'Konfirmasi Hapus Mapel',
        'Apakah Anda yakin ingin menghapus mata pelajaran ' + nama + '?',
        function() {
            google.script.run
                .withSuccessHandler(function() {
                    showGlobalNotificationDialog('Berhasil', 'Mapel ' + nama + ' berhasil dihapus.', 'success');
                    loadMapelData();
                })
                .apiDeleteMapel(id);
        },
        'Hapus',
        true
    );
}

function confirmResetAllMapel() {
    showConfirmResetModal(
        function() {
            google.script.run
                .withSuccessHandler(function() {
                    showGlobalNotificationDialog('Berhasil', 'Seluruh data mata pelajaran telah direset.', 'success');
                    loadMapelData();
                })
                .apiDeleteAllMapel();
        },
        'Reset Hapus Semua Mapel',
        'Tindakan ini akan mengosongkan seluruh master mata pelajaran. Apakah Anda yakin ingin melanjutkan?'
    );
}

function exportMapelExcel() {
    var filename = 'Data_Mata_Pelajaran_' + new Date().toISOString().split('T')[0] + '.xlsx';
    var headers = ['No', 'Kode Mapel', 'Nama Mata Pelajaran', 'Kelompok Kurikulum', 'Status'];
    var rows = [];
    mapelList.forEach(function(m, idx) {
        var st = (String(m.aktif) === '1' || m.aktif === true) ? 'Aktif' : 'Nonaktif';
        rows.push([idx + 1, m.kode_mapel || '-', m.nama_mapel, m.kelompok || 'Kejuruan', st]);
    });
    downloadExcelXLS(filename, headers, rows);
}
</script>
</body>
