                        <tr><td colspan="9" style="text-align: center; padding: 2rem; color: var(--text-muted);"><i class="bi bi-arrow-repeat spin"></i> Memuat berkas...</td></tr>

<script type="text/template" id="serverDataPayload">
<?!= (typeof serverData !== 'undefined' && serverData) ? JSON.stringify(serverData) : 'null' ?>
</script>

<script>
var baList = [];

onDocumentReady(function() {
    loadBAData();
});

function loadBAData() {
    window.AppStore.loadInitialData(function(data) {
        window.AppStore.data = data;
        baList = (data && data.berita_acara) || [];

        var filterKelas = document.getElementById('filterKelas');
        if (filterKelas) {
            var currCid = filterKelas.value;
            filterKelas.innerHTML = '<option value="">Semua Rombel</option>';
            ((data && data.classes) || []).forEach(function(c) {
                var opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.nama_kelas;
                if (String(c.id) === String(currCid)) opt.selected = true;
                filterKelas.appendChild(opt);
            });
        }

        filterArsipTable();
    });
}

function filterArsipTable() {
    var kw = document.getElementById('filterKeyword').value.trim().toLowerCase();
    var tgl = document.getElementById('filterTanggal').value;
    var cid = document.getElementById('filterKelas').value;

    var filtered = baList.filter(function(b) {
        if (kw) {
            var matchKw = (b.mata_pelajaran && b.mata_pelajaran.toLowerCase().indexOf(kw) !== -1) ||
                          (b.nama_pengawas_1 && b.nama_pengawas_1.toLowerCase().indexOf(kw) !== -1) ||
                          (b.ruang && b.ruang.toLowerCase().indexOf(kw) !== -1);
            if (!matchKw) return false;
        }
        if (tgl && b.tanggal_ujian !== tgl) return false;
        if (cid && String(b.class_id) !== String(cid)) return false;
        return true;
    });

    renderArsipTable(filtered);
}

function renderArsipTable(items) {
    var tbody = document.getElementById('tableArsipBody');
    document.getElementById('badgeTotalArsip').textContent = items.length + ' Berkas';

    if (!items || items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 2rem; color: var(--text-muted);">Tidak ada berkas berita acara.</td></tr>';
        return;
    }

    var html = '';
    items.forEach(function(b, idx) {
        var counts = (b.peserta_hadir || 0) + ' / ' + (b.peserta_tidak_hadir || 0) + ' / ' + (b.peserta_seharusnya || 0);

        var photoCount = 0;
        try {
            var photos = typeof b.foto_dokumentasi === 'string' ? JSON.parse(b.foto_dokumentasi) : b.foto_dokumentasi;
            if (Array.isArray(photos)) photoCount = photos.length;
        } catch (e) {}
        var photoBadge = photoCount > 0 ? '<span class="badge" style="background:#dcfce7; color:#15803d;"><i class="bi bi-camera"></i> ' + photoCount + ' Foto</span>' : '<span class="badge" style="background:#f1f5f9; color:#94a3b8;">Tidak ada</span>';

        html += '<tr>' +
            '<td>' + (idx + 1) + '</td>' +
            '<td>' + (b.tanggal_ujian || '-') + '</td>' +
            '<td><strong>' + (b.nama_kelas || '-') + '</strong></td>' +
            '<td>' + (b.mata_pelajaran || '-') + '</td>' +
            '<td>' + (b.ruang || '-') + '</td>' +
            '<td style="text-align: center;"><span class="badge" style="background:#f1f5f9; color:#1e293b; font-weight:700;">' + counts + '</span></td>' +
            '<td style="text-align: center;">' + photoBadge + '</td>' +
            '<td>' + (b.nama_pengawas_1 || '-') + '</td>' +
            '<td style="text-align: center; white-space: nowrap;">' +
            '<a href="' + window.APP_URL + '?page=preview&type=berita-acara&id=' + b.id + '" target="_blank" class="btn btn-secondary btn-sm" title="Pratinjau A4 Tab Baru" style="padding: 2px 7px;"><i class="bi bi-eye"></i></a> ' +
            '<button type="button" class="btn btn-danger-soft btn-sm" onclick="deleteBA(' + b.id + ')" title="Hapus Berkas" style="padding: 2px 7px;"><i class="bi bi-trash"></i></button>' +
            '</td>' +
            '</tr>';
    });
    tbody.innerHTML = html;
}

function deleteBA(id) {
    showGlobalConfirmDialog(
        'Konfirmasi Hapus Berkas',
        'Apakah Anda yakin ingin menghapus Berita Acara ini?',
        function() {
            google.script.run
                .withSuccessHandler(function() {
                    showGlobalNotificationDialog('Berhasil', 'Berita Acara berhasil dihapus.', 'success');
                    loadBAData();
                })
                .apiDeleteBeritaAcara(id);
        },
        'Hapus',
        true
    );
}

function confirmResetAllArsip() {
    showConfirmResetModal(
        function() {
            google.script.run
                .withSuccessHandler(function() {
                    showGlobalNotificationDialog('Berhasil', 'Seluruh arsip Berita Acara berhasil dikosongkan.', 'success');
                    loadBAData();
                })
                .apiDeleteAllBeritaAcara();
        },
        'Reset Hapus Semua Arsip Berita Acara',
        'Tindakan ini akan mengosongkan seluruh riwayat Berita Acara dan lampiran foto. Apakah Anda yakin ingin melanjutkan?'
    );
}

function exportArsipExcel() {
    var filename = 'Rekap_Arsip_Berita_Acara_' + new Date().toISOString().split('T')[0] + '.xlsx';
    var headers = ['No', 'Tanggal', 'Kelas', 'Mata Pelajaran', 'Ruang', 'Peserta Seharusnya', 'Hadir', 'Tidak Hadir', 'Blangko BA', 'Blangko DH', 'Catatan', 'Pengawas 1', 'NIP 1'];
    var rows = [];
    baList.forEach(function(b, idx) {
        rows.push([
            idx + 1, b.tanggal_ujian, b.nama_kelas, b.mata_pelajaran, b.ruang || '-',
            b.peserta_seharusnya || 0, b.peserta_hadir || 0, b.peserta_tidak_hadir || 0,
            b.blangko_berita_acara || 1, b.blangko_daftar_hadir || 1, b.catatan_pelaksanaan || '-',
            b.nama_pengawas_1, b.nip_pengawas_1 || '-'
        ]);
    });
    downloadExcelXLS(filename, headers, rows);
}
</script>
</body>
</html>
