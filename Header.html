<script>
window.toggleAdminSidebar = function(e) {
    if (e) {
        try { e.preventDefault(); e.stopPropagation(); } catch (err) {}
    }
    var body = document.body;
    var sb = document.getElementById('adminSidebar');
    var bd = document.getElementById('adminSidebarBackdrop');
    if (window.innerWidth <= 900) {
        body.classList.remove('sidebar-collapsed');
        var isOpen = body.classList.toggle('mobile-sidebar-open');
        if (sb) sb.classList.toggle('show', isOpen);
        if (bd) bd.classList.toggle('show', isOpen);
    } else {
        body.classList.remove('mobile-sidebar-open');
        if (sb) sb.classList.remove('show');
        if (bd) bd.classList.remove('show');
        var isCollapsed = body.classList.toggle('sidebar-collapsed');
        try { localStorage.setItem('admin_sidebar_collapsed', isCollapsed ? 'true' : 'false'); } catch (err) {}
    }
    return false;
};

window.closeAdminSidebar = function(e) {
    if (e) {
        try { e.preventDefault(); e.stopPropagation(); } catch (err) {}
    }
    document.body.classList.remove('mobile-sidebar-open');
    var sb = document.getElementById('adminSidebar');
    if (sb) sb.classList.remove('show');
    var bd = document.getElementById('adminSidebarBackdrop');
    if (bd) bd.classList.remove('show');
    return false;
};
</script>
